  /campaigns/send:
    post:
      summary: Send campaign
      description: >-
        Sends a campaign to all of a bot's subscribers that were active within
        the last 24 hours. You can send a campaign with text, an image, or a
        file. To view an example of the request body, select a message type from
        the drop-down list
      security:
        - oAuth2ClientCredentials: []
      tags:
        - campaigns
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              properties:
                title:
                  type: string
                  description: Campaign title
                bot_id:
                  type: string
                  description: >-
                    Bot ID. Can be obtained with a method of getting a list of
                    bots. You can also find it in your account in the address
                    bar of a chat window with the desired contact.
                send_at:
                  type: string
                  description: >-
                    Specify the date and time in the format Y-m-d H:i if you
                    need to schedule the campaign, if you do not specify this
                    parameter, the campaign will be sent immediately
                  example: Y-m-d H:i
                filter:
                  type: object
                  description: Filter for campaign sending
                  properties:
                    type:
                      type: string
                      description: Filter type (and/or)
                    expressions:
                      type: array
                      description: Filter expressions
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            description: Expression type (and/or)
                          expressions:
                            type: array
                            description: List of expressions
                            items:
                              type: object
                              properties:
                                operator:
                                  type: string
                                  description: >-
                                    Filter operator (e.g., eq, like, gt, lt,
                                    etc.)
                                field:
                                  type: string
                                  description: Field to filter by (e.g., tags)
                                value:
                                  type: string
                                  description: Value to filter by
                messages:
                  type: array
                  description: >-
                    Message to send, specifying the type and content of the
                    campaign
                  items:
                    type: object
                    description: api.paths.contacts.sendText.parameters.message
                    properties:
                      type:
                        type: string
                        enum:
                          - text
                          - image
                          - document
                        description: api.paths.contacts.sendText.parameters.message_type
                        example: text
                      text:
                        type: object
                        properties:
                          body:
                            type: string
                            description: >-
                              The content of the text message. You can add text
                              with emoji of up to 1024 unicode characters.
                        required:
                          - body
                      image:
                        type: object
                        description: api.paths.contacts.sendText.parameters.image
                        properties:
                          link:
                            type: string
                            description: api.paths.contacts.sendText.parameters.image_url
                          caption:
                            type:
                              - string
                              - 'null'
                            description: >-
                              api.paths.contacts.sendText.parameters.image_caption
                        required:
                          - link
                      file:
                        type: object
                        description: api.paths.contacts.sendText.parameters.file
                        properties:
                          link:
                            type: string
                            description: api.paths.contacts.sendText.parameters.file_url
                          caption:
                            type:
                              - string
                              - 'null'
                            description: >-
                              api.paths.contacts.sendText.parameters.file_caption
                        required:
                          - link
                    required:
                      - type
              required:
                - title
                - bot_id
                - messages
            examples:
              Send a campaign with text:
                value:
                  title: string
                  bot_id: string
                  send_at: Y-m-d H:i
                  filter:
                    type: and
                    expressions:
                      - type: and
                        expressions:
                          - operator: eq
                            field: tags
                            value: SOME_TAG_HERE
                  messages:
                    - type: text
                      text:
                        body: string
              Send a campaign with an image:
                value:
                  title: string
                  bot_id: string
                  send_at: Y-m-d H:i
                  messages:
                    - type: image
                      image:
                        link: string
                        caption: string
              Send a campaign with a file:
                value:
                  title: string
                  bot_id: string
                  send_at: Y-m-d H:i
                  messages:
                    - type: document
                      document:
                        link: string
                        caption: string
              Send a campaign with different content types:
                value:
                  title: string
                  bot_id: string
                  send_at: Y-m-d H:i
                  messages:
                    - type: text
                      text:
                        body: string
                    - type: image
                      image:
                        link: string
                        caption: string
                    - type: document
                      document:
                        link: string
                        caption: string
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Campaign'
                type: object
      operationId: sendCampaign
      x-ai-role: chatbot_campaign_manager
      x-ai-description: >-
        Broadcasts a message campaign to all active subscribers of a specific
        bot who interacted within the last 24 hours. This is the primary
        mass-communication action in the WhatsApp chatbot channel — it initiates
        a one-to-many push that cannot be recalled once sent. Supports immediate
        or scheduled delivery, optional audience filtering by tags or custom
        fields, and multi-type message payloads (text, image, document) within a
        single campaign.
      x-ai-reasoning-instructions:
        - >-
          Verify the bot_id is valid and belongs to the user's account before
          proceeding — use the 'get bots list' method if uncertain.
        - >-
          Confirm the target audience: if no filter is provided, the campaign
          will be sent to ALL active subscribers; always warn the user if the
          scope seems unintentionally broad.
        - >-
          If send_at is specified, validate the datetime format strictly as
          'Y-m-d H:i' (e.g., '2024-12-31 14:00'); incorrect format will cause
          the campaign to fail silently or send immediately.
        - >-
          When multiple message types are included in the messages array, ensure
          each object has the correct required nested field (text.body,
          image.link, file.link) matching its type.
        - >-
          Remind the user that only subscribers active within the last 24 hours
          will receive the campaign — low recent activity may result in a very
          small reach.
        - >-
          If a filter is used, validate that the filter structure is correct:
          top-level 'type' (and/or) with nested expressions before calling.
      x-ai-responding-instructions:
        - >-
          Confirm whether the campaign was scheduled or sent immediately, and
          mention the campaign ID from the response data for tracking.
        - >-
          If a filter was applied, acknowledge the audience scope (e.g., 'sent
          only to subscribers tagged X').
        - >-
          If the response indicates failure, explain the likely cause (invalid
          bot_id, malformed payload, inactive subscribers) and suggest
          corrective action.
        - >-
          Suggest using the campaign retrieval endpoint to monitor delivery
          status after a scheduled campaign is queued.
      x-ai-suggestions:
        - Weekly_Newsletter_Blast
        - Promo_Flash_Sale_24h
        - Onboarding_Reminder_New_Users
      x-ai-capabilities:
        confirmation:
          type: Required
          message: >-
            This action will broadcast a message to all active bot subscribers
            (last 24h). If no filter is set, the entire active audience will be
