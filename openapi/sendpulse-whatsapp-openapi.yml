        phone number within a specific bot's audience. Unlike campaign-based
        sending, this endpoint targets an individual active contact in real
        time, supporting rich media formats (text, image, document, audio) and
        interactive button messages. Use this for personalized outreach,
        transactional notifications, or agent-initiated conversations outside of
        automated flows.
      x-ai-reasoning-instructions:
