        contact. Template messages are the only way to initiate outbound
        conversations in WhatsApp (outside the 24-hour service window) — they
        must be pre-approved by Meta and support structured content: variable
        substitution, image/video/document headers, and quick-reply or URL
        buttons. This endpoint is the primary gateway for transactional and
        re-engagement messaging at scale.
      x-ai-reasoning-instructions:
