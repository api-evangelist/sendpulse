  /contacts/sendTemplate:
    post:
      summary: Send a template message to the specified contact
      description: >-
        Sends a pre-approved template message to the contact with the specified
        contact ID. You can send a template with variables, buttons, image, or
        document headers. To view an example of the request body, select a
        message template from the drop-down list.
      security:
        - oAuth2ClientCredentials: []
      tags:
        - contacts
      requestBody:
        description: >-
          Sends a pre-approved template message to the contact with the
          specified contact ID. You can send a template with variables, buttons,
          image, or document headers. To view an example of the request body,
          select a message template from the drop-down list.
        required: true
        content:
          application/json:
            schema:
              properties:
                contact_id:
                  type: string
                  description: >-
                    Contact ID. Can be obtained with a contact search by tag or
                    variable. You can also find it in your account in the
                    address bar of a chat window with the desired contact.
                template:
                  type: object
                  description: >-
                    Content of the template. To get a template code in your
                    account, go to the "Templates" tab of your bot and, opposite
                    the desired template, click "Copy code." In the opened
                    window, copy the value of the "template" parameter.
                  properties:
                    name:
                      type: string
                      example: event_started
                      description: Template name
                    language:
                      type: object
                      description: Template language
                      properties:
                        code:
                          type: string
                          example: en
                      required:
                        - code
                    components:
                      type: array
                      description: >-
                        The set of additional parameters differs depending on
                        the included template components and can include
                        variables, an image, or a file.
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            description: >-
                              Accepted values: header / body / footer depending
                              on where you want to insert the component
                          sub_type:
                            type: string
                            description: >-
                              Accepted values: url / quick_reply / catalog.
                              Required when type=button. Not used for the other
                              types. Type of button to create
                          index:
                            type: int
                            description: >-
                              Required when type=button. Not used for the other
                              types. Position index of the button. You can have
                              up to 3 buttons using index values of 0 to 2.
                          parameters:
                            type: array
                            description: >-
                              Сustom template variables. Specify the type, name
                              and value of the variable
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                  description: Variable type
                                image:
                                  type: object
                                  description: >-
                                    The image you want to send. Includes the URL
                                    to the image and caption
                                  properties:
                                    link:
                                      type: string
                                      description: >-
                                        Full URL of the file you want to send,
                                        including the "https" protocol part. You
                                        can only send links to SSL-secured sites
                                video:
                                  type: object
                                  description: >-
                                    The video you want to send. Includes the URL
                                    to the video file.
                                  properties:
                                    link:
                                      type: string
                                      description: >-
                                        Full URL of the file you want to send,
                                        including the "https" protocol part. You
                                        can only send links to SSL-secured sites
                                payload:
                                  type: object
                                  description: >-
                                    Required for quick_reply buttons.
                                    Developer-defined payload that is returned
                                    when the button is clicked in addition to
                                    the display text on the button.
                                  properties:
                                    to_chain_id:
                                      type: string
                  required:
                    - name
                    - language
              required:
                - contact_id
                - template
            examples:
              Send a simple template message:
                value:
                  contact_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  template:
                    name: thanks_for_buying
                    language:
                      code: en
                    components: []
              Send a template message with variables:
                value:
                  contact_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  template:
                    name: thanks_for_buying_personal
                    language:
                      code: en
                    components:
                      - type: body
                        parameters:
                          - type: text
                            text: Firstname
                          - type: text
                            text: Secondname
              Send a template message with an image:
                value:
                  contact_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  template:
                    name: thanks_for_buying_image
                    language:
                      code: en
                    components:
                      type: header
                      parameters:
                        - type: image
                          image:
                            link: https://www.example.com/image.jpg
              Send a template message with a document:
                value:
                  contact_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  template:
                    name: thanks_for_buying_document
                    language:
                      code: en
                    components:
                      type: header
                      parameters:
                        - type: document
                          document:
                            link: https://www.example.com/file.zip
                            filename: file.zip
              Send a template message with a video:
                value:
                  contact_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  template:
                    name: thanks_for_buying_video
                    language:
                      code: en
                    components:
