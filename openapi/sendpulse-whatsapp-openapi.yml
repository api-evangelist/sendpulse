        Sends a template message to all of a bot's subsribers. You can send a
        campaign with text, an image, or a file. To view an example of the
        request body, select a message template from the drop-down list
      security:
        - oAuth2ClientCredentials: []
      tags:
        - campaigns
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              properties:
                title:
                  type: string
                  description: Campaign title
                bot_id:
                  type: string
                  description: >-
                    Bot ID. Can be obtained with a method of getting a list of
                    bots. You can also find it in your account in the address
                    bar of a chat window with the desired contact.
                send_at:
                  type: string
                  description: >-
                    Specify the date and time in the format Y-m-d H:i if you
                    need to schedule the campaign, if you do not specify this
                    parameter, the campaign will be sent immediately
                  example: Y-m-d H:i
                template:
                  type: object
                  description: >-
                    Content of the template. To get a template code in your
                    account, go to the "Templates" tab of your bot and, opposite
                    the desired template, click "Copy code." In the opened
                    window, copy the value of the "template" parameter.
                  properties:
                    name:
                      type: string
                      example: event_started
                      description: Template name
                    language:
                      type: object
                      description: Template language
                      properties:
                        code:
                          type: string
                          example: en
                      required:
                        - code
                    components:
                      type: array
                      description: >-
                        The set of additional parameters differs depending on
                        the included template components and can include
                        variables, an image, or a file.
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            description: >-
                              Accepted values: header / body / footer depending
                              on where you want to insert the component
                          sub_type:
                            type: string
                            description: >-
                              Accepted values: url / quick_reply / catalog.
                              Required when type=button. Not used for the other
                              types. Type of button to create
                          index:
                            type: int
                            description: >-
                              Required when type=button. Not used for the other
                              types. Position index of the button. You can have
                              up to 3 buttons using index values of 0 to 2.
                          parameters:
                            type: array
                            description: >-
                              Сustom template variables. Specify the type, name
                              and value of the variable
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                  description: Variable type
                                image:
                                  type: object
                                  description: >-
                                    The image you want to send. Includes the URL
                                    to the image and caption
                                  properties:
                                    link:
                                      type: string
                                      description: >-
                                        Full URL of the file you want to send,
                                        including the "https" protocol part. You
                                        can only send links to SSL-secured sites
                                    caption:
                                      type: string
                                      description: Caption for the image
                                payload:
                                  type: string
                                  description: >-
                                    Required for quick_reply buttons.
                                    Developer-defined payload that is returned
                                    when the button is clicked in addition to
                                    the display text on the button.
                  required:
                    - name
                    - language
              required:
                - title
                - bot_id
                - template
            examples:
              Send a campaign by template with text:
                value:
                  title: Thanks for buying
                  bot_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  send_at: 2021-01-21 12:00
                  template:
                    name: thanks_for_buying
                    language:
                      code: en
                    components: []
              Send a campaign by template with an image:
                value:
                  title: Thanks for buying
                  bot_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  send_at: 2021-01-21 12:00
                  template:
                    name: thanks_for_buying_image
                    language:
                      code: en
                    components:
                      type: header
                      parameters:
                        - type: image
                          image:
                            link: https://www.example.com/image.jpg
              Send a template message with payload buttons:
                value:
                  title: Thanks for buying
                  bot_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  send_at: 2021-01-21 12:00
                  template:
                    name: thanks_for_buying_payload
                    language:
                      code: en
                    components:
                      - type: body
                        parameters:
                          - type: text
                            text: some text
                      - type: button
                        sub_type: quick_reply
                        index: 0
                        parameters:
                          - type: payload
                            to_chain_id: xxxxxxxxxxxxxxxxxxxxxxxx
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Campaign'
                type: object
      operationId: sendTemplateCampaign
      x-ai-role: chatbot_campaign_manager
      x-ai-description: >-
        Initiates a mass broadcast to all subscribers of a WhatsApp bot using a
        pre-approved template. Unlike free-form messages, WhatsApp Business
        requires approved templates for outbound campaigns — this endpoint is
        the primary mechanism for scheduled or immediate bulk outreach. Template
        selection, language match, and component substitution (variables,
        images, buttons) must be correct before sending, as failed campaigns
        cannot be recalled.
      x-ai-reasoning-instructions:
        - >-
          Verify the bot_id is valid and belongs to an active WhatsApp bot
          before constructing the request.
        - >-
          Check that the template name matches an approved template in the
          account — unapproved or misspelled template names will cause the
          campaign to fail silently or return an error.
        - >-
          If send_at is provided, validate the datetime format strictly as
          'Y-m-d H:i' (e.g., '2025-04-01 09:00'); incorrect format will prevent
          scheduling.
        - >-
          If components are included, ensure the type values ('header', 'body',
          'button') match the actual structure of the selected template —
          mismatched components cause API rejection.
        - >-
          For button components (type=button), sub_type and index are required;
          remind the user that index must be 0–2 and quick_reply requires a
          payload.
        - >-
          If the campaign is immediate (no send_at), warn the user that it will
          be dispatched to all subscribers instantly with no undo option.
        - Image links must use HTTPS — HTTP links will be rejected.
      x-ai-responding-instructions:
        - >-
          On success, confirm the campaign was queued or scheduled and surface
          the campaign ID from the response data for tracking.
        - >-
          If send_at was provided, explicitly state the scheduled dispatch time
          in a human-readable format.
        - >-
          If success is false, surface the error reason clearly and suggest
          corrective action (e.g., wrong template name, invalid bot_id,
          malformed component).
        - >-
          Remind the user that this sends to ALL bot subscribers — suggest using
          filters or segments if partial targeting was intended.
        - >-
          After a successful send, suggest checking campaign delivery stats via
          the campaigns list or analytics endpoints.
      x-ai-suggestions:
        - >-
          Use `send_at` to schedule campaigns during high-engagement hours
          (e.g., 10:00–12:00 local time).
        - >-
          Retrieve valid template names from the 'Templates' tab of the bot or
          via the templates API before calling this endpoint.
        - >-
          For personalized campaigns, populate `components[].parameters` with
          per-variable values matching template placeholders.
      x-ai-capabilities:
        confirmation:
          type: Required
          message: >-
            This will immediately send a message to ALL subscribers of the
            selected bot. Confirm before proceeding.
        security_info:
          data_handling:
            - MassBroadcast
            - IrreversibleAction
  /account:
    get:
      summary: Get account info
      description: >-
        Returns information about your current account pricing plan, the number
        of messages in your plan, bots, contacts, list of tags, and variables
      security:
        - oAuth2ClientCredentials: []
      tags:
        - account
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Account'
                type: object
      operationId: getAccount
      x-ai-role: account_manager
      x-ai-description: >-
        Provides a real-time snapshot of the account's current state: active
        pricing plan, remaining message quotas, connected bots, total contacts,
        and all defined tags and variables. Use this as the entry point before
        planning campaigns — quota limits directly determine what actions are
        feasible.
      x-ai-reasoning-instructions:
        - >-
          Call this endpoint first when the user asks about their plan, limits,
          or available resources.
        - >-
          Use quota fields to validate whether a planned bulk send or bot
          campaign is within the account's current limits before proceeding.
        - >-
          If tags or variables are returned, surface them to the user as
          available segmentation options for upcoming campaigns.
        - >-
          Cross-reference bot count against the user's intent — if they want to
          create a new bot but the limit is reached, flag this proactively.
      x-ai-responding-instructions:
        - >-
          Summarize the pricing plan name and key quotas (messages remaining,
          contacts, bots) in a human-readable format.
        - >-
          If quotas are low (e.g., <10% remaining), warn the user and suggest
          upgrading or optimizing usage.
        - >-
          List available tags and variables only if the user's intent involves
          segmentation or personalization.
        - >-
          Avoid dumping the full raw response — highlight what is actionable
          given the user's current goal.
      x-ai-suggestions:
        - >-
          Check this before scheduling a large email campaign to confirm message
          quota is sufficient.
        - >-
          Use returned variable names as valid merge tags when composing
          personalized messages.
        - >-
          If bot count equals the plan limit, advise the user to remove unused
          bots before creating new ones.
      x-ai-capabilities:
        confirmation:
          type: None
        security_info:
          data_handling:
            - ReadOnly
  /templates:
    get:
      summary: Get a template list
      description: Returns a list of templates with information about each template
      security:
        - oAuth2ClientCredentials: []
      parameters:
        - in: query
          name: bot_id
          required: true
          schema:
            type: string
          description: >-
            The bot ID where the templates are located. Can be obtained with a
            method of getting a list of bots. You can also find it in your
            account in the address bar of a chat window with the desired
            contact.
      tags:
        - templates
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Template'
                type: object
      operationId: getTemplateList
      x-ai-role: chatbot_content_manager
      x-ai-description: >-
        Retrieves all message templates configured for a specific bot. Templates
        are reusable content blocks that define the structure of outgoing
        messages — text, buttons, media — and serve as the foundation for
        campaigns and automated flows. Knowing which templates exist and their
        current state is essential before scheduling any broadcast or building a
        bot scenario.
      x-ai-reasoning-instructions:
        - >-
          Ensure a valid bot_id is provided — it is required and the request
          will fail without it.
        - >-
          Use the bot listing endpoint first if the bot_id is unknown or needs
          to be confirmed.
        - >-
          If the user wants to send a campaign, retrieve templates first to let
          them pick an existing one before suggesting creation of a new one.
        - >-
          Check whether returned templates are active/approved before
          recommending them for use in a flow.
      x-ai-responding-instructions:
        - >-
          Present the template list with names and IDs so the user can easily
          identify which one to use.
        - >-
          If the list is empty, suggest creating a new template as the next
          step.
        - >-
          If multiple templates exist, help the user filter by name or content
          type based on their goal.
        - >-
          Mention the bot context clearly so the user understands the results
          are scoped to one specific bot.
      x-ai-suggestions:
        - >-
          Use the returned template IDs with the send-campaign endpoint to
          launch a broadcast.
        - >-
          If no suitable template exists, proceed to create one with the
          template creation endpoint.
        - >-
          Cross-reference bot_id with the bot list if you are unsure which bot
          owns the desired templates.
      x-ai-capabilities:
        confirmation:
          type: None
        security_info:
          data_handling:
            - ReadOnly
  /tags:
    get:
      summary: Get a list of tags
      description: >-
        Returns the list of created tags for the selected bot with information
        about each of them: tag ID, name, contact_count and creation date
      security:
        - oAuth2ClientCredentials: []
      tags:
        - tags
      parameters:
        - in: query
          name: bot_id
          required: true
          schema:
            type: string
          description: >-
            Bot ID. Can be obtained with a method of getting a list of bots. You
            can also find it in your account in the address bar of a chat window
            with the desired contact.
        - in: query
          name: size
          description: The limit of pagination items, that will be returned
          schema:
            type: integer
        - in: query
          name: skip
          description: The offset of pagination items, where starts a current items batch
          schema:
            type: integer
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
                type: object
      operationId: listTags
      x-ai-role: chatbot_audience_manager
      x-ai-description: >-
        Retrieves a paginated list of tags defined for a specific bot. Tags are
        labeling primitives used to segment contacts in the chatbot audience —
        understanding available tags is a prerequisite for any filtering,
        segmentation, or automated flow targeting by tag.
      x-ai-reasoning-instructions:
        - >-
          Always require bot_id before calling — without it the scope is
          undefined.
        - >-
          If the user needs to find a specific tag, retrieve the full list first
          and filter client-side, as there is no server-side name filter.
        - >-
          Use 'size' and 'skip' parameters for large bots; default batch may not
          return all tags.
        - >-
          Cross-reference contact_count to identify orphaned or unused tags that
          may be candidates for cleanup.
      x-ai-responding-instructions:
        - >-
          Present the result as a structured list: tag name, ID, and
          contact_count for each entry.
        - >-
          If contact_count is 0 for all returned tags, flag that the bot may
          have tags defined but no contacts assigned yet.
        - >-
          Suggest using a returned tag ID as input for contact filtering or flow
          targeting operations.
        - >-
          If the list is truncated (size limit reached), inform the user and
          suggest increasing 'size' or paginating with 'skip'.
      x-ai-suggestions:
        - >-
          Retrieve all tags first to map names to IDs before applying them to
          contacts.
        - >-
          Use contact_count to prioritize high-volume segments for campaign
          targeting.
        - >-
          Paginate with size=50 and increment skip to enumerate all tags for
          large bots.
      x-ai-capabilities:
        confirmation:
          type: None
        security_info:
          data_handling:
            - ReadOnly
