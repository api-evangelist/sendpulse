  /contacts/sendTemplateByPhone:
    post:
      summary: Send a template message to a contact by phone number
      description: >-
        Sends a pre-approved template message to a new or existing contact with
        the specified phone number. You can send a template with variables,
        buttons, image, or document headers. To view an example of the request
        body, select a message template from the drop-down list
      security:
        - oAuth2ClientCredentials: []
      tags:
        - contacts
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              properties:
                bot_id:
                  type: string
                  description: >-
                    Bot ID to whose audience you are sending a message. Can be
                    obtained with a method of getting a list of bots. You can
                    also find it in your account in the address bar of a chat
                    window with the desired contact.
                phone:
                  type: string
                  description: Contact's phone number in international format.
                template:
                  type: object
                  description: >-
                    Content of the template. To get a template code in your
                    account, go to the "Templates" tab of your bot and, opposite
                    the desired template, click "Copy code." In the opened
                    window, copy the value of the "template" parameter.
                  properties:
                    name:
                      type: string
                      example: event_started
                      description: Template name
                    language:
                      type: object
                      description: Template language
                      properties:
                        code:
                          type: string
                          example: en
                          description: Can have the values en, ru ..
                      required:
                        - code
                    components:
                      type: array
                      description: >-
                        The set of additional parameters differs depending on
                        the included template components and can include
                        variables, an image, or a file.
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            description: >-
                              Accepted values: header / body / footer depending
                              on where you want to insert the component
                          parameters:
                            type: array
                            description: >-
                              Сustom template variables. Specify the type, name
                              and value of the variable
                            items:
                              type: object
                              sub_type:
                                type: string
                                description: >-
                                  Accepted values: url / quick_reply / catalog.
                                  Required when type=button. Not used for the
                                  other types. Type of button to create
                              index:
                                type: int
                                description: >-
                                  Required when type=button. Not used for the
                                  other types. Position index of the button. You
                                  can have up to 3 buttons using index values of
                                  0 to 2.
                              properties:
                                type:
                                  type: string
                                  description: Variable type
                                image:
                                  type: object
                                  description: >-
                                    The image you want to send. Includes the URL
                                    to the image and caption
                                  properties:
                                    link:
                                      type: string
                                      description: >-
                                        Full URL of the file you want to send,
                                        including the "https" protocol part. You
                                        can only send links to SSL-secured sites
                                video:
                                  type: object
                                  description: >-
                                    The video you want to send. Includes the URL
                                    to the video file.
                                  properties:
                                    link:
                                      type: string
                                      description: >-
                                        Full URL of the file you want to send,
                                        including the "https" protocol part. You
                                        can only send links to SSL-secured sites
                                payload:
                                  type: object
                                  description: >-
                                    Required for quick_reply buttons.
                                    Developer-defined payload that is returned
                                    when the button is clicked in addition to
                                    the display text on the button.
                                  properties:
                                    to_chain_id:
                                      type: string
                  required:
                    - name
                    - language
              required:
                - bot_id
                - phone
                - template
            examples:
              Send a simple template message:
                value:
                  bot_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  phone: '380931112233'
                  template:
                    name: thanks_for_buying
                    language:
                      code: en
                    components: []
              Send a template message with variables:
                value:
                  bot_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  phone: '380931112233'
                  template:
                    name: thanks_for_buying_personal
                    language:
                      code: en
                    components:
                      - type: body
                        parameters:
                          - type: text
                            text: Firstname
                          - type: text
                            text: Secondname
              Send a template message with an image:
                value:
                  bot_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  phone: '380931112233'
                  template:
                    name: thanks_for_buying_image
                    language:
                      code: en
                    components:
                      type: header
                      parameters:
                        - type: image
                          image:
                            link: https://www.example.com/image.jpg
              Send a template message with a document:
                value:
                  bot_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  phone: '380931112233'
                  template:
                    name: thanks_for_buying_document
                    language:
                      code: en
                    components:
                      - type: header
                        parameters:
                          - type: document
                            document:
                              link: https://www.example.com/file.zip
                              filename: file.zip
              Send a template message with a video:
                value:
                  bot_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  phone: '380931112233'
                  template:
                    name: thanks_for_buying_video
                    language:
                      code: en
                    components:
                      - type: header
                        parameters:
                          - type: video
                            video:
                              link: https://www.example.com/video.mp4
              Send a template message with payload buttons:
                value:
                  bot_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  phone: '380931112233'
                  template:
                    name: thanks_for_buying_image
                    language:
                      code: en
                    components:
                      - type: body
                        parameters:
                          - type: text
                            text: some text
                      - type: button
                        sub_type: quick_reply
                        index: 0
                        parameters:
                          - type: payload
                            payload:
                              to_chain_id: xxxxxxxxxxxxxxxxxxxxxxxx
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Message'
                type: object
      operationId: sendTemplateByPhone
      x-ai-role: whatsapp_messaging_specialist
      x-ai-description: >-
        Sends a pre-approved WhatsApp Business template message to a contact
        identified by phone number. Template messages are the only way to
        initiate or re-engage a conversation outside the 24-hour customer
        service window — they require prior Meta approval and must match exactly
        the registered template structure (name, language, component types).
        This endpoint is the primary channel for transactional notifications,
        order updates, and re-engagement flows.
      x-ai-reasoning-instructions:
        - >-
          Before calling, verify that the template name and language code exist
          and are approved in the WhatsApp Business account — using an
          unapproved or mismatched template will result in an error.
        - >-
          Ensure the phone number is in E.164 international format (e.g.,
          '380931112233') without '+' prefix — leading zeros or local formats
          will fail silently or return errors.
        - >-
          Match the number and types of `components` parameters exactly to the
          template definition; extra or missing variables will cause the request
          to be rejected by Meta.
        - >-
          For templates with a `header` component of type image/video/document,
          the `link` must point to a publicly accessible HTTPS URL; private or
          expired links will result in delivery failure.
        - >-
          For button components with `sub_type: quick_reply`, the `index` must
          correspond to the button's position in the template (0-based);
          incorrect indexing causes wrong button payload routing.
        - >-
          If `components` is empty (`[]`), the template is sent as-is with no
          variable substitution — only use this for static templates.
        - >-
          Confirm the `bot_id` belongs to an active WhatsApp bot; sending via an
          inactive or disconnected bot will silently fail.
      x-ai-responding-instructions:
        - >-
          On success, confirm the message was dispatched and mention the
          contact's phone number and template name used.
        - >-
          If the response includes a Message object, surface the message ID for
          tracking purposes.
        - >-
          If the template has buttons with `to_chain_id`, inform the user that
          clicking the button will trigger the linked automation flow.
        - >-
          If an error occurs related to template structure mismatch, guide the
          user to copy the exact template code from the SendPulse Templates tab
          using the 'Copy code' feature.
        - >-
          Suggest verifying delivery status via the contact's message history if
          no webhook confirmation is expected.
      x-ai-suggestions:
        - >-
          Use for post-purchase confirmations, appointment reminders, or
          shipping notifications outside the 24h window.
        - >-
          Combine with contact lookup to verify the phone number exists before
          sending.
        - >-
          For personalized messages, always pre-fetch the template structure to
          ensure variable count matches.
      x-ai-capabilities:
        confirmation:
          type: Recommended
          message: >-
            You are about to send a WhatsApp template message to {phone} using
            template '{template.name}'. Confirm to proceed.
        security_info:
          data_handling:
            - ExternalMessageDelivery
            - PII_PhoneNumber
          notes: >-
            Phone numbers are PII — do not log or expose them in error messages.
            Template messages consume WhatsApp Business API quota.
