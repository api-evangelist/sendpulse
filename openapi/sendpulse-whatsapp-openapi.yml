        execution entry point for chatbot/messaging automation — it bridges
        CRM-level contact data with a configured message sequence. The
        `external_data` payload enables one-time, per-execution variable
        injection, making the same flow reusable across different transactional
        contexts (e.g., order tracking, shipping notifications) without
        modifying the flow itself.
      x-ai-reasoning-instructions:
        - >-
          Resolve `contact_id` before calling this endpoint — use contact search
          by tag or variable if only a phone/email is known.
        - >-
          Resolve `flow_id` via the list-flows endpoint if the caller only knows
          the flow name.
        - >-
          If `external_data` is provided, verify that the flow actually contains
          `{{$[...]}}` variable references — otherwise the data is silently
          ignored.
        - >-
          Check that the contact belongs to the correct channel the flow targets
          (e.g., WhatsApp, Telegram) to avoid silent no-ops.
        - >-
