  /contacts/send:
    post:
      summary: Send a message to a contact
      description: >-
        Sends a text message, image, or a file to contact with the specified
        contact ID. To view an example of the request body, select a message
        type from the drop-down list. 

         You can also use the original data structures specified in Meta\'s documentation https://developers.facebook.com/docs/whatsapp/cloud-api/guides/send-messages by specifying the correct 'type' and the corresponding data structure for that type.
      security:
        - oAuth2ClientCredentials: []
      tags:
        - contacts
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              properties:
                contact_id:
                  type: string
                  description: >-
                    Contact ID. Can be obtained with a contact search by tag or
                    variable. You can also find it in your account in the
                    address bar of a chat window with the desired contact.
                message:
                  type: object
                  description: >-
                    Message to send, specifying the type and content of the
                    campaign
                  properties:
                    type:
                      type: string
                      enum:
                        - text
                        - image
                        - document
                        - audio
                        - interactive
                        - reaction
                      description: >-
                        Message type, can have the values "text," "image," or
                        "document"
                      example: text
                    text:
                      type: object
                      properties:
                        body:
                          type: string
                          description: >-
                            The content of the text message. You can add text
                            with emoji of up to 1024 unicode characters.
                      required:
                        - body
                    image:
                      type: object
                      description: >-
                        The image you want to send. Includes the URL to the
                        image and caption
                      properties:
                        link:
                          type: string
                          description: >-
                            Full URL of the image you want to send, including
                            the "https" protocol part. You can only send links
                            to SSL-secured sites
                        caption:
                          type:
                            - string
                            - 'null'
                          description: Caption for the image
                      required:
                        - link
                    file:
                      type: object
                      description: >-
                        The file you want to send. Includes the URL to the image
                        and caption
                      properties:
                        link:
                          type: string
                          description: >-
                            Full URL of the file you want to send, including the
                            "https" protocol part. You can only send links to
                            SSL-secured sites
                        caption:
                          type:
                            - string
                            - 'null'
                          description: Caption for the image
                      required:
                        - link
                    audio:
                      type: object
                      description: >-
                        The audio you want to send. Includes the URL to the
                        audio
                      properties:
                        link:
                          type: string
                          description: >-
                            Full HTTPS URL of the audio file you want to send.
                            Only SSL-secured links are allowed.
                        voice:
                          type: boolean
                          default: false
                          description: >-
                            Indicates that the audio should be sent as a voice
                            message
                      required:
                        - link
                    interactive:
                      type: object
                      description: >-
                        The interactive object you want to send. Includes the
                        buttons and text
                      properties:
                        type:
                          type: string
                          enum:
                            - button
                        body:
                          type: string
                          description: >-
                            The content of the text message. You can add text
                            with emoji of up to 1024 unicode characters.
                        action:
                          type: object
                          properties:
                            buttons:
                              type: array
                              items:
                                type: object
                                properties:
                                  type:
                                    type: string
                                    enum:
                                      - reply
                                  to_chain_id:
                                    type: string
                                  reply:
                                    types: object
                                    properties:
                                      title:
                                        type: string
                    reaction:
                      type: object
                      description: Reaction to a message
                      properties:
                        message_id:
                          type: string
                          description: ID of the message to react to
                        emoji:
                          type: string
                          description: Reaction emoji
                      required:
                        - message_id
                        - emoji
                  required:
                    - type
              required:
                - contact_id
                - message
            examples:
              Send a text message:
                value:
                  contact_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  message:
                    type: text
                    text:
                      body: string
              Send a message with an image:
                value:
                  contact_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  message:
                    type: image
                    image:
                      link: string
                      caption: string
              Send a message with a file:
                value:
                  contact_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  message:
                    type: document
                    document:
                      link: string
                      caption: string
              Send a message with an audio:
                value:
                  contact_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  message:
                    type: audio
                    audio:
                      link: string
                      voice: bool
              Send a message with payload button:
                value:
                  contact_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  message:
                    type: interactive
                    interactive:
                      type: button
                      body:
                        text: Example text
                      action:
                        buttons:
                          - type: reply
                            to_chain_id: xxxxxxxxxxxxxxxxxxxxxxxx
                            reply:
                              title: Example payload button
              Send a reaction:
                value:
                  contact_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  message:
                    type: reaction
                    reaction:
                      message_id: xxxxxxxxxxxxxxxxxxxxxxxx
                      emoji: 👍
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Message'
                type: object
      operationId: sendContactMessage
      x-ai-role: whatsapp_messaging_specialist
      x-ai-description: >-
        Delivers a direct message to a specific WhatsApp contact within
        SendPulse. This is a one-on-one outreach operation — not a broadcast —
        used for support responses, transactional confirmations, or personalized
        follow-ups. The endpoint is a facade over Meta's Cloud API, so both
        native SendPulse message structures and raw Meta payloads are accepted.
        Choosing the right message type (text vs. interactive vs. reaction)
        significantly affects engagement and bot flow continuation.
      x-ai-reasoning-instructions:
        - >-
          Resolve the contact_id before calling — use contact search by tag or
          variable if only a name or phone is known.
        - >-
          Match the message type to the use case: use 'text' for simple replies,
          'interactive' with buttons to continue a bot flow (to_chain_id),
          'reaction' to acknowledge a specific message, and
          'image'/'document'/'audio' for media delivery.
        - >-
          For 'image', 'document', and 'audio' types, verify the URL is HTTPS
          and publicly accessible before sending; Meta rejects non-SSL or
          private links.
        - >-
          When sending 'audio' with voice: true, ensure the file is in a format
          supported as a voice message (e.g., OGG/OPUS); generic MP3 links may
          be rejected.
        - >-
          For 'interactive' type with buttons, each button must have a valid
          to_chain_id pointing to an existing bot flow chain; invalid chain IDs
          will silently break the flow.
        - >-
          The 'reaction' type requires a valid message_id from the conversation
          history — it cannot be used to react to your own outgoing messages in
          all contexts.
        - >-
          If the user provides raw Meta API structures not covered by the
          schema's enum, remind them these are passthrough-supported but not
          validated by SendPulse.
      x-ai-responding-instructions:
        - >-
          Confirm success by noting the message type sent and the target
          contact_id.
        - >-
          If the response includes a Message object, surface the message ID for
          potential follow-up use (e.g., reacting to this message later).
        - >-
          For 'interactive' messages, mention that the contact's button tap will
          trigger the linked bot chain (to_chain_id).
        - >-
          On failure, distinguish between contact resolution errors (wrong
          contact_id) and delivery errors (bad URL, unsupported format, Meta API
          rejection).
        - >-
          Suggest logical next steps: checking delivery status, sending a
          follow-up, or branching the bot flow based on response.
      x-ai-suggestions:
        - 'Send a quick text reply to a support inquiry using type: text'
        - 'Send an image with a promo caption using type: image'
        - >-
          Present reply buttons to guide the contact through a bot flow using
          type: interactive
        - >-
          React to a contact's message with an emoji acknowledgement using type:
          reaction
        - 'Send a voice message by setting audio.voice: true'
      x-ai-capabilities:
        confirmation:
          type: None
        security_info:
          data_handling:
            - ExternalDelivery
            - ContactDataAccess
          notes: >-
            Message is delivered via Meta's WhatsApp Cloud API. Ensure contact
            has opted in to receive messages to comply with WhatsApp Business
            Policy and applicable data protection regulations.
