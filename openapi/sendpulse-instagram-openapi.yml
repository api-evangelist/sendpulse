        agents before they generate a response. The contact_id is the central
        access key and must be resolved before calling.
      x-ai-reasoning-instructions:
        - >-
          Always resolve contact_id first — use contact search by tag, variable,
          or instruct the user to copy it from the chat window URL.
        - >-
          If the user wants recent messages, use order=desc with a small size
          (e.g., 10–20) rather than fetching all records.
        - >-
          For large conversation histories, implement cursor-based pagination
          using search_after with the last returned message ID to avoid offset
          drift.
        - >-
          If the goal is to reconstruct a full conversation timeline, use
          order=asc to process messages chronologically.
        - >-
          Do not pass skip and search_after simultaneously — prefer search_after
          for deep pagination as it is more stable under concurrent writes.
      x-ai-responding-instructions:
        - >-
          Present the message count and pagination info so the user understands
          how many records were returned vs. total available.
        - >-
          If no messages are returned, clarify whether the contact exists and
          has prior conversation history.
        - >-
          When showing messages, group or label them by sender direction
          (inbound/outbound) if that field is available in the Message schema.
        - >-
          Suggest using search_after with the last message ID when the user
          needs the next page.
      x-ai-suggestions:
        - Use order=desc&size=20 to quickly preview the most recent messages.
        - >-
          Combine with a contact search endpoint to resolve contact_id
          dynamically before calling.
        - >-
          To paginate forward, pass the id of the last item in the current batch
          as search_after.
      x-ai-capabilities:
        confirmation:
          type: None
        security_info:
          data_handling:
            - ReadOnly
            - PersonalData
  /variables:
    get:
      summary: Get a list of variables
      description: >-
        Returns a list of variables for the selected bot with information about
        each: variable ID, bot ID, name, affiliation, type, status, and creation
        date
      security:
        - oAuth2ClientCredentials: []
      tags:
        - variables
      parameters:
        - in: query
          name: bot_id
          required: true
          schema:
            type: string
          description: >-
            Bot ID. Can be obtained with a method of getting a list of bots. You
            can also find it in your account in the address bar of a chat window
            with the desired contact.
        - in: query
          name: size
          description: The limit of pagination items, that will be returned
          schema:
            type: integer
        - in: query
          name: skip
          description: The offset of pagination items, where starts a current items batch
          schema:
            type: integer
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Variable'
                type: object
      operationId: listBotVariables
      x-ai-role: chatbot_data_architect
      x-ai-description: >-
        Retrieves the full catalogue of custom variables defined for a specific
        bot. Variables are the core personalization layer in SendPulse chatbots
        — they store subscriber-level data (e.g., name, order status, loyalty
        tier) that drive conditional flows, dynamic messages, and segmentation.
        Knowing which variables exist and their types is a prerequisite before
        writing values or building automation logic.
      x-ai-reasoning-instructions:
        - >-
          Always resolve the bot_id first — use the list-bots endpoint if the
          user hasn't provided it explicitly.
        - >-
          Use size and skip for pagination when the bot has many variables;
          default page size may be small.
        - >-
          Check variable 'type' (string, number, boolean, date) before advising
          the user how to set values — type mismatches cause silent failures.
        - >-
          If the returned list is empty, inform the user that no variables have
          been created yet and suggest creating them via the set-variable
          endpoint.
      x-ai-responding-instructions:
        - >-
          Present variables grouped by 'affiliation' (contact-level vs
          bot-level) to help the user understand scope.
        - >-
          Highlight variable 'name' and 'type' as the most actionable fields for
          subsequent write operations.
        - >-
          If pagination fields (size/skip) were used, indicate whether more
          records may exist beyond the current batch.
        - >-
          Suggest next steps: filtering subscribers by variable value or
          updating a variable via the assign-variable endpoint.
      x-ai-suggestions:
        - >-
          Fetch all variables first to audit what personalization data is
          available before building a message flow.
        - >-
          Use variable IDs from this response when constructing conditions in
          automation sequences.
        - >-
          Cross-reference 'status' field to skip inactive variables in
          downstream logic.
      x-ai-capabilities:
        confirmation:
          type: None
        security_info:
          data_handling:
            - ReadOnly
  /campaigns/send:
    post:
      summary: Send campaign
      description: >-
        Sends a campaign to all of a bot's subscribers that were active within
        the last 24 hours. You can send a campaign with text, an image, or a
        file. To view an example of the request body, select a message type from
        the drop-down list
      security:
        - oAuth2ClientCredentials: []
      tags:
        - campaigns
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              properties:
                title:
                  type: string
                  description: Campaign title
                bot_id:
                  type: string
                  description: >-
                    Bot ID. Can be obtained with a method of getting a list of
                    bots. You can also find it in your account in the address
                    bar of a chat window with the desired contact.
                send_at:
                  type: string
                  description: >-
                    Specify the date and time in the format Y-m-d H:i if you
                    need to schedule the campaign, if you do not specify this
                    parameter, the campaign will be sent immediately
                  example: Y-m-d H:i
                filter:
                  type: object
                  description: Filter for campaign sending
                  properties:
                    type:
                      type: string
                      description: Filter type (and/or)
                    expressions:
                      type: array
                      description: Filter expressions
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            description: Expression type (and/or)
                          expressions:
                            type: array
                            description: List of expressions
                            items:
                              type: object
                              properties:
                                operator:
                                  type: string
                                  description: >-
                                    Filter operator (e.g., eq, like, gt, lt,
                                    etc.)
                                field:
                                  type: string
                                  description: Field to filter by (e.g., tags)
                                value:
                                  type: string
                                  description: Value to filter by
                messages:
                  type: array
                  description: >-
                    Message to send, specifying the type and content of the
                    campaign
                  items:
                    type: object
                    description: api.paths.contacts.sendText.parameters.message
              required:
                - title
                - bot_id
                - messages
            examples:
              Send a campaign with text:
                value:
                  title: string
                  bot_id: string
                  send_at: Y-m-d H:i
                  filter:
                    type: and
                    expressions:
                      - type: and
                        expressions:
                          - operator: eq
                            field: tags
                            value: SOME_TAG_HERE
                  messages:
                    - type: text
                      message:
                        text: string
              Send a campaign with an image:
                value:
                  title: string
                  bot_id: string
                  send_at: Y-m-d H:i
                  messages:
                    - type: image
                      message:
                        attachment:
                          type: image
                          payload:
                            is_external_attachment: true
                            url: https://example.com/image.png
              Send a message with a carousel:
                value:
                  title: string
                  bot_id: string
                  send_at: Y-m-d H:i
                  messages:
                    - type: generic_template
                      message:
                        attachment:
                          payload:
                            elements:
                              - title: Example title
                                subtitle: Example subtitle
                                image_url: https://example.com/image.png
                                is_external_attachment: true
                                buttons:
                                  - type: web_url
                                    title: Example button
                                    url: https://example.com/
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Campaign'
                type: object
      operationId: sendCampaign
      x-ai-role: chatbot_campaign_manager
      x-ai-description: >-
        Initiates a broadcast to all active bot subscribers (active within last
        24 hours). This is the primary mass-communication trigger in SendPulse
        chatbot automation — it supports rich message types (text, image, file,
        carousel) and optional audience filtering by tags or custom fields.
        Scheduling via send_at allows campaign orchestration without manual
        intervention.
      x-ai-reasoning-instructions:
        - >-
          Always verify the bot_id is valid and belongs to the user's account
          before sending — use the list bots endpoint if unsure.
        - >-
          Warn the user that only subscribers active within the last 24 hours
          will receive the campaign; this is not a full subscriber list.
        - >-
          If send_at is provided, validate that the datetime format matches
          exactly 'Y-m-d H:i' (e.g., '2026-03-26 14:00') and that it is in the
          future.
        - >-
          If filter expressions are used, confirm the filter logic (and/or) and
          field values (e.g., existing tags) before sending to avoid unintended
          audience exclusion.
        - >-
          When composing carousel (generic_template) messages, ensure each
          element has at minimum a title; subtitle and image_url are optional
          but improve engagement.
        - >-
          For image or file messages, prefer external URLs
          (is_external_attachment: true) that are publicly accessible.
        - >-
          Remind the user that this action triggers an immediate send (or
          schedules it) and cannot be recalled — confirm intent before
          executing.
      x-ai-responding-instructions:
        - >-
          On success, confirm that the campaign was sent (or scheduled) and
          mention the campaign data returned in the response.
        - >-
          If send_at was specified, clearly state the scheduled time and
          timezone assumptions.
        - >-
          If a filter was applied, summarize the audience targeting logic so the
          user can verify it matches their intent.
        - >-
          On error, diagnose the likely cause: invalid bot_id, malformed message
          structure, or incorrect datetime format.
      x-ai-suggestions:
        - >-
          Use filter by tags to target specific subscriber segments instead of
          the full active audience.
        - >-
          Schedule campaigns during peak engagement hours relevant to the bot's
          audience timezone.
        - >-
          Combine text and image message types in the messages array for richer
          content.
        - >-
          After sending, retrieve campaign stats to measure delivery and open
          rates.
      x-ai-capabilities:
        confirmation:
          type: Required
          message: >-
            This action will immediately broadcast a message to all active
            subscribers of the selected bot. Confirm before proceeding.
        security_info:
          data_handling:
            - MassMessageDelivery
            - IrreversibleAction
  /tags:
    get:
      summary: Get a list of tags
      description: >-
        Returns the list of created tags for the selected bot with information
        about each of them: tag ID, name, contact_count and creation date
      security:
        - oAuth2ClientCredentials: []
      tags:
        - tags
      parameters:
        - in: query
          name: bot_id
          required: true
          schema:
            type: string
          description: >-
            Bot ID. Can be obtained with a method of getting a list of bots. You
            can also find it in your account in the address bar of a chat window
            with the desired contact.
        - in: query
          name: size
          description: The limit of pagination items, that will be returned
          schema:
            type: integer
        - in: query
          name: skip
          description: The offset of pagination items, where starts a current items batch
          schema:
            type: integer
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
                type: object
      operationId: getTags
      x-ai-role: chatbot_audience_manager
      x-ai-description: >-
        Retrieves the full catalog of tags defined for a specific bot, including
        usage statistics (contact_count) and creation dates. Tags are the
        primary segmentation mechanism in chatbot flows — knowing which tags
        exist and how widely they are applied is essential before triggering
        campaigns, filtering contacts, or designing automation rules.
      x-ai-reasoning-instructions:
        - >-
          Always require bot_id before calling — tags are bot-scoped and have no
          meaning without it.
        - >-
          If the user needs a specific tag by name, fetch the full list first
          and filter client-side, as there is no server-side name filter.
        - >-
          Use size and skip together when the bot has a large audience and tag
          count may be high.
        - >-
          contact_count is a quick health signal — tags with 0 contacts may
          indicate stale segmentation that should be cleaned up.
      x-ai-responding-instructions:
        - >-
          Present tags as a table or structured list with name, contact_count,
          and creation date for clarity.
        - >-
          If contact_count is 0 for most tags, suggest the user review their
          tagging flows.
        - >-
          When the user is looking for a specific tag, highlight the match and
          its ID for use in subsequent calls.
        - >-
          Suggest next steps such as filtering contacts by tag or triggering a
          campaign to a tag segment.
      x-ai-suggestions:
        - >-
          Fetch tags before creating automation rules to avoid duplicating
          existing segments.
        - >-
          Use the returned tag IDs in contact filter or campaign targeting
          endpoints.
        - Paginate with size=50 and skip incrementally if the bot has many tags.
      x-ai-capabilities:
        confirmation:
          type: None
        security_info:
          data_handling:
            - ReadOnly
  /account:
    get:
      summary: Get account info
      description: >-
        Returns information about your current account pricing plan, the number
        of messages in your plan, bots, contacts, list of tags, and variables
      security:
        - oAuth2ClientCredentials: []
      tags:
        - account
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Account'
                type: object
      operationId: getAccount
      x-ai-role: account_management_specialist
      x-ai-description: >-
        Provides a real-time snapshot of the account's current state: active
        pricing plan, remaining message quotas, bot and contact counts, and the
        full list of defined tags and variables. Use this as the starting point
        for any session that requires plan-aware logic — rate limits, feature
        availability, and capacity checks all depend on data returned here.
      x-ai-reasoning-instructions:
        - >-
          Call this endpoint at the start of a session to understand current
          plan limits before performing bulk operations.
        - >-
          Check message quota against the planned send volume — warn the user if
          remaining messages are insufficient.
        - >-
          Use the tags and variables lists to validate references in subsequent
          requests without making separate lookup calls.
        - >-
          If the plan tier is low, proactively mention which features or limits
          may restrict the user's intended workflow.
      x-ai-responding-instructions:
        - >-
          Summarize the pricing plan name and key quotas (messages remaining,
          bots, contacts) in a human-readable sentence.
        - >-
          If quota is below 20%, alert the user and suggest upgrading or
          reducing send frequency.
        - >-
          When tags or variables are present, briefly note their count so the
          user knows reusable assets exist.
      x-ai-suggestions:
        - >-
          Run this before scheduling a campaign to confirm sufficient message
          quota.
        - >-
          Use returned tags to pre-populate filters in contact segmentation
          calls.
      x-ai-capabilities:
        confirmation:
          type: None
        security_info:
          data_handling:
            - ReadOnly
