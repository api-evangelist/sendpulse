    post:
      summary: Run a flow by its ID
      description: >-
        Launches the selected flow for the selected contact. Additional data can
        be passed to the "external_data" field and used once in the selected
        chain, where variables will be inserted in the "Message" element as a
        JSON path, for example {{$['tracking_number']}}.
      security:
        - oAuth2ClientCredentials: []
      tags:
        - flows
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              properties:
                contact_id:
                  type: string
                  description: >-
                    Contact ID. Can be obtained with a contact search by tag or
                    variable. You can also find it in your account in the
                    address bar of a chat window with the desired contact.
                flow_id:
                  type: string
                  description: >-
                    Flow ID to be launched. Can be obtained with the method of
                    obtaining the list of flows
                external_data:
                  type: object
                  description: >-
                    Custom variables. You can pass variable values in the
                    request and use them once in the flow you selected. To add
                    variables to the flow, in the Message element, insert the
                    variable names as a JSON path expression
                    {{$['somekey']['nestedkey']}}.
                  example:
                    tracking_number: 1234-0987-5678-9012
              required:
                - contact_id
                - flow_id
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
      operationId: runFlow
      x-ai-role: marketing_automation_specialist
      x-ai-description: >-
        Triggers a pre-built automation flow for a specific contact, optionally
        injecting one-time contextual data (e.g. order tracking numbers, booking
        references) that will be interpolated into message elements via JSON
        path expressions. This is the primary entry point for event-driven
        personalized messaging — use it when an external system event (purchase,
        shipment, support ticket) should initiate a contact-specific
        communication sequence.
      x-ai-reasoning-instructions:
        - >-
          Verify that the contact_id belongs to the correct bot/account before
          triggering — a wrong contact in a transactional flow can send
          sensitive data to the wrong person.
        - >-
          Confirm the flow_id is active and not in draft state; launching an
          incomplete flow may result in silent failure or an incomplete user
          experience.
        - >-
          If external_data is provided, validate that the keys match the JSON
          path expressions used inside the flow's Message elements (e.g. if the
          flow uses {{$['tracking_number']}}, the payload must contain
          'tracking_number').
        - >-
          external_data values are consumed only once — they are not persisted
          as contact variables. If long-term storage is needed, use
          variable-update endpoints before calling this.
        - >-
          Check rate limits if triggering flows in bulk — prefer batch or queued
          approaches for mass launches.
      x-ai-responding-instructions:
        - >-
          On success, confirm that the flow has been launched for the specified
          contact and mention the flow_id used.
        - >-
          If external_data was passed, acknowledge which dynamic variables were
          injected.
        - >-
          Suggest verifying delivery by checking flow execution logs or contact
          activity in the SendPulse account.
        - >-
          If the call fails due to an invalid contact_id or flow_id, guide the
          user to the appropriate lookup endpoints to retrieve valid IDs.
      x-ai-suggestions:
        - >-
          Use 'get flow list' endpoint to retrieve valid flow_id values before
          calling this.
        - >-
          Use contact search by tag or variable to resolve contact_id
          dynamically.
        - >-
          Pass shipment tracking numbers, appointment confirmations, or promo
          codes via external_data for one-time personalization.
      x-ai-capabilities:
        confirmation:
          type: Recommended
          message: >-
            This will immediately trigger a live message flow for the specified
            contact. Confirm contact_id and flow_id before proceeding.
        security_info:
          data_handling:
            - ExternalDataIsTransient
            - ContactMessagingAction
