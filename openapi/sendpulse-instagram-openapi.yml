                    address bar of a chat window with the desired contact.
                trigger_keyword:
                  type: string
                  description: Keyword (command) that launch the flow
                external_data:
                  type: object
                  description: >-
                    Custom variables. You can pass variable values in the
                    request and use them once in the flow you selected. To add
                    variables to the flow, in the Message element, insert the
                    variable names as a JSON path expression
                    {{$['somekey']['nestedkey']}}.
                  example:
                    tracking_number: 1234-0987-5678-9012
              required:
                - contact_id
                - trigger_keyword
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
      operationId: runFlowByTrigger
      x-ai-role: chatbot_automation_engineer
      x-ai-description: >-
        Programmatically injects a trigger keyword into a contact's conversation
        context, simulating the exact action a user would take by typing a
        command. This is the primary mechanism for launching automation flows
        from external systems — CRMs, e-commerce platforms, or event-driven
        pipelines — without waiting for the contact to initiate interaction.
        External data passed here is ephemeral: available only within this
        single flow execution, making it ideal for injecting transient context
        like order numbers or session tokens.
      x-ai-reasoning-instructions:
        - >-
          Resolve the contact_id first — use contact search by tag or variable
          if only an email/phone is known; the ID is also visible in the account
          URL when viewing a chat.
        - >-
          Confirm the trigger_keyword exactly matches a keyword configured in
          the target flow; mismatches will silently fail to launch the flow.
        - >-
          If passing external_data, verify the flow contains Message elements
          with matching JSON path expressions (e.g., {{$['tracking_number']}}) —
          otherwise variables will render as empty.
        - >-
          External data is single-use and not persisted to the contact profile;
          if persistence is needed, set contact variables separately before or
          after this call.
        - >-
          Check that the flow is active and not paused or archived before
          attempting to trigger it.
      x-ai-responding-instructions:
        - >-
          Confirm the flow was launched successfully and mention which contact
          and trigger keyword were used.
        - >-
          If external_data was passed, note that those values are ephemeral and
          available only within this execution.
        - >-
          If the operation fails, help the user verify the trigger_keyword
          spelling and flow active status.
        - >-
          Suggest monitoring the contact's conversation or flow analytics to
          confirm the flow executed as expected.
      x-ai-suggestions:
        - >-
          Use this endpoint from post-purchase webhooks to trigger order
          confirmation or shipping notification flows.
        - >-
          Combine with contact search endpoints to resolve contact_id
          dynamically from an email or phone number.
        - >-
          Use external_data to pass one-time tokens, tracking numbers, or
          personalized URLs into the flow messages.
      x-ai-capabilities:
        confirmation:
          type: Recommended
          message: >-
            This will immediately launch a flow and may send messages to the
            contact. Confirm the correct contact_id and trigger_keyword before
            proceeding.
