  /contacts/sendTemplate:
    post:
      summary: Send a template message to the specified contact
      description: Sends a pre-approved template message to the contact with the specified contact ID. You can send a template with variables, buttons, image, or document headers. To view an example of the request body, select a message template from the drop-down list.
      security:
      - oAuth2ClientCredentials: []
      tags:
      - Contacts
      requestBody:
        description: Sends a pre-approved template message to the contact with the specified contact ID. You can send a template with variables, buttons, image, or document headers. To view an example of the request body, select a message template from the drop-down list.
        required: true
        content:
          application/json:
            schema:
              properties:
                contact_id:
                  type: string
                  description: Contact ID. Can be obtained with a contact search by tag or variable. You can also find it in your account in the address bar of a chat window with the desired contact.
                template:
                  type: object
                  description: Content of the template. To get a template code in your account, go to the "Templates" tab of your bot and, opposite the desired template, click "Copy code." In the opened window, copy the value of the "template" parameter.
                  properties:
                    name:
                      type: string
                      example: event_started
                      description: Template name
                    language:
                      type: object
                      description: Template language
                      properties:
                        code:
                          type: string
                          example: en
                      required:
                      - code
                    components:
                      type: array
                      description: The set of additional parameters differs depending on the included template components and can include variables, an image, or a file.
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            description: 'Accepted values: header / body / footer depending on where you want to insert the component'
                          sub_type:
                            type: string
                            description: 'Accepted values: url / quick_reply / catalog. Required when type=button. Not used for the other types. Type of button to create'
                          index:
                            type: int
                            description: Required when type=button. Not used for the other types. Position index of the button. You can have up to 3 buttons using index values of 0 to 2.
                          parameters:
                            type: array
                            description: Сustom template variables. Specify the type, name and value of the variable
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                  description: Variable type
                                image:
                                  type: object
                                  description: The image you want to send. Includes the URL to the image and caption
                                  properties:
                                    link:
                                      type: string
                                      description: Full URL of the file you want to send, including the "https" protocol part. You can only send links to SSL-secured sites
                                video:
                                  type: object
                                  description: The video you want to send. Includes the URL to the video file.
                                  properties:
                                    link:
                                      type: string
                                      description: Full URL of the file you want to send, including the "https" protocol part. You can only send links to SSL-secured sites
                                payload:
                                  type: object
                                  description: Required for quick_reply buttons. Developer-defined payload that is returned when the button is clicked in addition to the display text on the button.
                                  properties:
                                    to_chain_id:
                                      type: string
                  required:
                  - name
                  - language
              required:
              - contact_id
              - template
            examples:
              Send a simple template message:
                value:
                  contact_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  template:
                    name: thanks_for_buying
                    language:
                      code: en
                    components: []
              Send a template message with variables:
                value:
                  contact_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  template:
                    name: thanks_for_buying_personal
                    language:
                      code: en
                    components:
                    - type: body
                      parameters:
                      - type: text
                        text: Firstname
                      - type: text
                        text: Secondname
              Send a template message with an image:
                value:
                  contact_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  template:
                    name: thanks_for_buying_image
                    language:
                      code: en
                    components:
                      type: header
                      parameters:
                      - type: image
                        image:
                          link: https://www.example.com/image.jpg
              Send a template message with a document:
                value:
                  contact_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  template:
                    name: thanks_for_buying_document
                    language:
                      code: en
                    components:
                      type: header
                      parameters:
                      - type: document
                        document:
                          link: https://www.example.com/file.zip
                          filename: file.zip
              Send a template message with a video:
                value:
                  contact_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  template:
                    name: thanks_for_buying_video
                    language:
                      code: en
                    components:
                      type: header
                      parameters:
                      - type: video
                        video:
                          link: https://www.example.com/video.mov
              Send a template message with payload buttons:
                value:
                  contact_id: xxxxxxxxxxxxxxxxxxxxxxxx
                  template:
                    name: thanks_for_buying_image
                    language:
                      code: en
                    components:
                    - type: body
                      parameters:
                      - type: text
                        text: some text
                    - type: button
                      sub_type: quick_reply
                      index: 0
                      parameters:
                      - type: payload
                        payload:
                          to_chain_id: xxxxxxxxxxxxxxxxxxxxxxxx
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Message_7'
                type: object
      operationId: sendTemplateToContact
      x-ai-role: whatsapp_messaging_specialist
      x-ai-description: 'Delivers a pre-approved WhatsApp Business template message to a specific contact. Template messages are the only way to initiate outbound conversations in WhatsApp (outside the 24-hour service window) — they must be pre-approved by Meta and support structured content: variable substitution, image/video/document headers, and quick-reply or URL buttons. This endpoint is the primary gateway for transactional and re-engagement messaging at scale.'
      x-ai-reasoning-instructions:
      - Before sending, confirm the template name and language code are correct — an unknown template or mismatched locale will cause an immediate failure.
      - Retrieve the contact_id via a contact search (by tag or variable) if the caller only knows an email, phone, or tag.
      - If the template includes body variables, ensure the `components` array contains a `body` entry with `parameters` in the exact order the placeholders appear in the template.
      - For header components, determine the media type first (image / video / document) and supply only the matching key — do not mix image and video fields in the same parameter object.
      - 'When using quick_reply buttons, include `sub_type: quick_reply` and a numeric `index` (0–2); omit `sub_type` and `index` for non-button components.'
      - All media URLs must use HTTPS (SSL-secured). Validate the URL scheme before constructing the request.
      - If the user provides no components, send an empty array — never omit the field when the schema expects it.
      x-ai-responding-instructions:
      - 'Confirm delivery by surfacing the `success: true` flag and the returned Message ID from the `data` object.'
      - If the call fails, distinguish between a bad template name, a wrong language code, a missing required component, and a contact-not-found error — each has a different remediation path.
      - After a successful send, suggest monitoring the message status or setting up a webhook to track delivery and read receipts.
      - When the user sends a template for the first time, remind them that WhatsApp limits unsolicited outbound messages and that the 24-hour conversation window resets upon contact reply.
      x-ai-suggestions:
      - Use `getContacts` or a tag-based contact search to resolve `contact_id` before calling this endpoint.
      - Copy the exact `template` object code from the Templates tab in your SendPulse bot dashboard to avoid name or language mismatches.
      - For personalized messages, pass body variable values in the same left-to-right order as the `{{1}}`, `{{2}}` placeholders in the approved template.
      - After sending, call the message status endpoint or configure a delivery webhook to confirm the contact received the message.
      x-ai-capabilities:
        confirmation:
          type: recommended
          reason: Sends a real message to a real contact via WhatsApp; accidental sends cannot be recalled.
        security_info:
          data_handling:
          - ExternalMessageDelivery
          - PersonalDataTransmission
          notes: contact_id references PII; media URLs are transmitted to WhatsApp infrastructure. Ensure HTTPS-only links and validate contact consent before sending.
