      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              properties:
                contact_id:
                  type: string
                  description: Contact ID. Can be obtained with a contact search by tag or variable. You can also find it in your account in the address bar of a chat window with the desired contact.
                message:
                  properties:
                    type:
                      type: string
                      enum:
                      - UPDATE
                      - RESPONSE
                      - MESSAGE_TAG
                      description: ''
                      example: RESPONSE
                    tag:
                      type: string
                      enum:
                      - HUMAN_AGENT
                      - CUSTOMER_FEEDBACK
                      description: ''
                      example: HUMAN_AGENT
                    content_type:
                      type: string
                      enum:
                      - message
                      - media_img
                      - media_file
                      - template
                      description: Type of data sent
                      example: message
                    text:
                      type: string
                      description: The parameter is required if the `content_type` parameter is equal to `message`
                      example: Hello world!
                    img:
                      type: sting
                      description: The parameter is required if the `content_type` parameter is equal to `media_img`
                      example: https://www.spcdn.org/images/promo-logo/correct/sendpulse-logo-13.png
                    file:
                      type: string
                      description: The parameter is required if the `content_type` parameter is equal to `media_file`
                      example: https://www.spcdn.org/images/promo-logo/correct/sendpulse-logo-13.png
                    data:
                      type: object
                      description: The paramater is required if the `content_type` paramater is equal to `template`
                      properties:
                        attachment:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - template
                            payload:
                              type: object
                              properties:
                                template_type:
                                  type: string
                                  enum:
                                  - generic
                                elements:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      title:
                                        type: string
                                      subtitle:
                                        type: string
                                      image_url:
                                        type: string
                                        example: https://www.spcdn.org/images/promo-logo/correct/sendpulse-logo-13.png
                                      buttons:
                                        type: array
                                        items:
                                          type: object
                                          properties:
                                            type:
                                              type: string
                                              enum:
                                              - web_url
                                              - postback
                                            title:
                                              type: string
                                            url:
                                              type: string
                  type: object
                  required:
                  - type
                  - content_type
              required:
              - contact_id
              - message
            examples:
              Send a text message:
                value:
                  contact_id: string
                  message:
                    type: RESPONSE
                    tag: CUSTOMER_FEEDBACK
                    content_type: message
                    text: Hello world!
              Send a message with a file:
                value:
                  contact_id: string
                  message:
                    type: RESPONSE
                    tag: CUSTOMER_FEEDBACK
                    content_type: media_file
                    file: https://www.spcdn.org/images/promo-logo/correct/sendpulse-logo-13.png
              Send a message with an image:
                value:
                  contact_id: string
                  message:
                    type: RESPONSE
                    tag: CUSTOMER_FEEDBACK
                    content_type: media_img
                    img: https://www.spcdn.org/images/promo-logo/correct/sendpulse-logo-13.png
              Send a message with a carousel:
                value:
                  contact_id: string
                  message:
                    type: RESPONSE
                    tag: CUSTOMER_FEEDBACK
                    content_type: template
                    data:
                      attachment:
                        type: template
                        payload:
                          template_type: generic
                          elements:
                          - title: Example title
                            subtitle: Example subtitle
                            image_url: https://example.com/image.png
                            buttons:
                            - type: web_url
                              title: Example button
                              url: https://example.com/
              Send a message with url button:
                value:
                  contact_id: string
                  message:
                    type: RESPONSE
                    tag: CUSTOMER_FEEDBACK
                    content_type: template
                    data:
                      attachment:
                        type: template
                        payload:
                          template_type: generic
                          elements:
                          - title: Example title
                            buttons:
                            - type: web_url
                              title: Example button
                              url: https://example.com/
              Send a message with payload button:
                value:
                  contact_id: string
                  message:
                    type: RESPONSE
                    tag: CUSTOMER_FEEDBACK
                    content_type: template
                    data:
                      attachment:
                        type: template
                        payload:
                          template_type: generic
                          elements:
                          - title: Example title
                            buttons:
                            - type: postback
                              title: Example button
                              data:
                                chain: string
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
      operationId: sendContactMessage
