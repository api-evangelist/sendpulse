  /campaigns/send:
    post:
      summary: Send campaign
      description: >-
        Sends a campaign to all of a bot's subscribers. You can send a campaign
        with text, an image, or a file. To view an example of the request body,
        select a message type from the drop-down list
      security:
        - oAuth2ClientCredentials: []
      tags:
        - campaigns
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              properties:
                title:
                  type: string
                  description: Campaign title
                bot_id:
                  type: string
                  description: >-
                    Bot ID. Can be obtained with a method of getting a list of
                    bots. You can also find it in your account in the address
                    bar of a chat window with the desired contact.
                send_at:
                  type: string
                  description: >-
                    Specify the date and time in the format Y-m-d H:i if you
                    need to schedule the campaign, if you do not specify this
                    parameter, the campaign will be sent immediately
                messages:
                  type: array
                  description: >-
                    Message to send, specifying the type and content of the
                    campaign
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - text
                        description: >-
                          Campaign type, can have the values "text," "image," or
                          "document"
                        example: text
                      filter:
                        type: object
                        description: Filter for campaign sending
                        properties:
                          type:
                            type: string
                            description: Filter type (and/or)
                          expressions:
                            type: array
                            description: Filter expressions
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                  description: Expression type (and/or)
                                expressions:
                                  type: array
                                  description: List of expressions
                                  items:
                                    type: object
                                    properties:
                                      operator:
                                        type: string
                                        description: >-
                                          Filter operator (e.g., eq, like, gt, lt,
                                          etc.)
                                      field:
                                        type: string
                                        description: Field to filter by (e.g., tags)
                                      value:
                                        type: string
                                        description: Value to filter by
                      message:
                        type: object
                        description: ''
                        properties:
                          text:
                            type: string
                            description: ''
                          message_effect_id:
                            oneOf:
                              - type: string
                                const: 66b08aae10702e7f680c4322
                                title: 🔥
                              - type: string
                                const: 66b08aae10702e7f680c4323
                                title: 👍
                              - type: string
                                const: 66b08aae10702e7f680c4324
                                title: 👎
                              - type: string
                                const: 66b08aae10702e7f680c4325
                                title: ❤️
                              - type: string
                                const: 66b08aae10702e7f680c4326
                                title: 🎉️
                              - type: string
                                const: 66b08aae10702e7f680c4327
                                title: 💩️
              required:
                - title
                - bot_id
                - messages
            examples:
              Send a message with an image:
                value:
                  title: string
                  bot_id: string
                  send_at: string
                  filter:
                    type: and
                    expressions:
                      - type: and
                        expressions:
                          - operator: eq
                            field: tags
                            value: SOME_TAG_HERE
                  messages:
                    - type: photo
                      message:
                        photo: https://www.cdn.com/photo.png
                        caption: string
              Send a text message:
                value:
                  title: string
                  bot_id: string
                  send_at: string
                  messages:
                    - type: text
                      message:
                        text: Example text
              Send a text message (HTML):
                value:
                  title: string
                  bot_id: string
                  send_at: string
                  messages:
                    - type: text
                      message:
                        text: >-
                          Example text sent via SP API <b>bold</b>,
                          <i>italic</i>, <a href='http://example.com'>link</a>
                        parse_mode: html
              Send a message with a file:
                value:
                  title: string
                  bot_id: string
                  send_at: string
                  messages:
                    - type: document
                      message:
                        document: https://www.cdn.com/document.zip
                        caption: string
              Send a message with an audio:
                value:
                  title: string
                  bot_id: string
                  send_at: string
                  messages:
                    - type: audio
                      message:
                        audio: https://www.cdn.com/audio.mp3
                        caption: string
              Send the voice message:
                value:
                  title: string
                  bot_id: string
                  send_at: string
                  messages:
                    - type: voice
                      message:
                        voice: https://www.cdn.com/audio.mp3
                        caption: string
              Send a message with an video:
                value:
                  title: string
                  bot_id: string
                  send_at: string
                  messages:
                    - type: video
                      message:
                        video: https://www.cdn.com/video.mp4
                        caption: string
              Send a message with a carousel:
                value:
                  title: string
                  bot_id: string
                  send_at: string
                  messages:
                    - type: carousel
                      message:
                        carousel:
                          - title: Slide 1 title
                            description: Slide 1 description
                            photo: https://www.cdn.com/photo1.png
                          - title: Slide 2 title
                            description: Slide 2 description
                            photo: https://www.cdn.com/photo2.png
                            reply_markup:
                              inline_keyboard:
                                - - text: Example button
                                    type: web_url
                                    url: http://example.url.com/
              Send text message with effect:
                value:
                  title: string
                  bot_id: string
                  send_at: string
                  messages:
                    - type: text
                      message:
                        text: Example text
                        message_effect_id: string
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Campaign'
                type: object
      operationId: sendCampaign
      x-ai-role: chatbot_campaign_manager
      x-ai-description: >-
        Initiates a mass broadcast to all subscribers of a specific bot, or a
        filtered subset. This is the primary delivery mechanism for chatbot
        marketing campaigns in SendPulse — supporting rich media (images, video,
        audio, documents, carousels), scheduled delivery, and audience
        segmentation via tag-based filters. Unlike transactional messages, this
        endpoint targets audiences at scale and is subject to campaign rate
        limits and bot-level sending quotas.
      x-ai-reasoning-instructions:
        - >-
          Confirm that `bot_id` is valid and the bot is active before sending —
          use the 'get list of bots' endpoint if the user is unsure which bot to
          target.
        - >-
          If the user wants to schedule the campaign, ensure `send_at` is
          formatted strictly as `Y-m-d H:i` (e.g., '2026-04-01 09:00') and is in
          the future relative to the account's timezone.
        - >-
          If no `send_at` is provided, the campaign is sent immediately — warn
          the user if they haven't reviewed the message content.
        - >-
          When building the `messages` array, validate that the `type` field
          matches the actual content keys inside `message` (e.g., type `photo`
          requires a `photo` URL, not `text`).
        - >-
          Carousel messages require at least two slides; validate this
          constraint before submitting.
        - >-
          If a `filter` is provided, ensure the filter structure is complete
          (type + expressions) to avoid unintended full-audience sends.
        - >-
          Media URLs (photo, document, audio, voice, video) must be publicly
          accessible CDN links — warn the user if they provide internal or
          authenticated URLs.
        - >-
          If `message_effect_id` is used, remind the user it only applies to
          text messages and requires the receiving platform to support message
          effects (e.g., Telegram).
      x-ai-responding-instructions:
        - >-
          On success, confirm that the campaign was queued or sent, and mention
          the campaign ID from the response for future reference.
        - >-
          If the campaign was scheduled, explicitly state the scheduled time so
          the user can verify it.
        - >-
          Suggest using the campaign status endpoint to monitor delivery
          progress after sending.
        - >-
          If an error occurs, diagnose whether it is related to an invalid
          bot_id, malformed message structure, or an invalid media URL, and
          guide the user accordingly.
        - >-
          Remind the user that mass campaigns cannot be individually recalled
          once sent — encourage review before immediate dispatch.
      x-ai-suggestions:
        - >-
          Schedule promotional campaigns during peak engagement hours (e.g.,
          10:00–12:00 local time).
        - >-
          Use tag filters to segment audiences and avoid sending irrelevant
          content to uninterested subscribers.
        - >-
          Use carousels for product showcases or multi-option CTAs for higher
          engagement rates.
        - >-
          Prefer `parse_mode: html` for text messages that require formatting
          (bold, italic, links).
      x-ai-capabilities:
        confirmation:
          type: Required
          message: >-
            This action will send a campaign to all (or filtered) subscribers of
            the specified bot. Immediate sends cannot be cancelled. Please
            confirm before proceeding.
        security_info:
          data_handling:
            - MassBroadcast
            - IrreversibleAction
