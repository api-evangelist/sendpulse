      operationId: sendContactMessage
      x-ai-role: chatbot_communication_specialist
      x-ai-description: >-
        Delivers a direct message to a specific chatbot contact across supported
        channels (Telegram, Facebook, etc.). This is the primary action endpoint
        for agent-driven conversations — it enables proactive outreach,
        automated responses, and rich interactive flows using carousels, inline
        buttons, and media attachments. Message delivery is one-shot and
        immediate; for sequences, use automation chains instead.
      x-ai-reasoning-instructions:
        - >-
          Resolve the contact_id first — it is not a phone or email, but an
          internal SendPulse contact identifier. Use contact search by tag or
          variable if the ID is not already known.
        - >-
          Match the message type to the content: use 'text' for plain or HTML
          messages, 'photo'/'video'/'document'/'audio' for media with a CDN URL,
          'voice' for ogg audio under 1MB, 'carousel' for multi-slide
          interactive cards, 'action' for typing indicators.
        - >-
          For voice messages, verify the file is audio/ogg and under 1MB —
          larger files will be delivered as generic audio, not voice bubbles.
        - >-
          When adding reply_markup buttons, distinguish between 'web_url' (opens
          a URL or Web App) and 'postback' (triggers a chatbot chain via
          to_chain_id). Do not mix up the required sub-fields.
        - >-
          If the user wants HTML formatting (bold, italic, links), set
          parse_mode to 'html' and use only supported Telegram HTML tags.
        - >-
          message_effect_id is a Telegram-specific feature — only use it for
          Telegram contacts and only with the predefined const values (fire,
          thumbs up/down, heart, confetti, poop).
        - >-
          Carousels require at least two slides; each slide can have its own
          reply_markup independently.
        - >-
          Do not send a 'typing' action as the final step — it is a UI indicator
          meant to precede an actual message.
      x-ai-responding-instructions:
        - >-
          Confirm the message was sent by echoing back the message type and
          contact_id.
        - >-
          If media was sent, confirm the URL was accepted (note: the API does
          not validate CDN availability at send time).
        - >-
          If the user sent a carousel, summarize the number of slides and which
          had buttons.
        - >-
          On error, distinguish between an invalid contact_id (contact not
          found) and a malformed payload (wrong type/missing fields).
        - >-
          Suggest follow-up actions: setting a tag on the contact, triggering an
          automation chain, or scheduling a follow-up message.
      x-ai-suggestions:
        - >-
          Send a text message: { contact_id, message: { type: 'text', text:
          '...' } }
        - >-
          Send an image with caption: { contact_id, message: { type: 'photo',
          photo: 'https://cdn.com/img.png', caption: '...' } }
        - >-
          Send a carousel with CTA buttons for product showcasing or onboarding
          flows
        - >-
          Send a typing action before a delayed message to simulate natural
          conversation pacing
        - >-
          Use parse_mode: 'html' for rich text with bold product names or
          clickable links
      x-ai-capabilities:
        confirmation:
          type: Recommended
          message: >-
            Confirm before sending to a contact, especially for broadcast-style
            or irreversible messages.
        security_info:
          data_handling:
            - ExternalDelivery
            - UserFacing
          notes: >-
            Message is delivered immediately and cannot be recalled. Media URLs
            must be publicly accessible at delivery time.
