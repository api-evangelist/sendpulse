                      enum:
                        - asc
                        - desc
                    fieldName:
                      type: string
                      enum:
                        - id
                        - created_at
                        - first_name
                        - attributeId
                        - responsible_id
                      example: id
                attributes:
                  $ref: '#/components/schemas/AttributesProperty'
                location:
                  type: string
                fieldValueConditions:
                  type: array
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        description: Field name
                        enum:
                          - attributes
                          - lastName
                          - phones
                          - emails
                          - messengers
                          - location
                          - tags
                      expression:
                        type: string
                        description: >-
                          | Possible values:

                          - eq (=) - neq (!=) - gt (>) - gte (>=) - lt (<) - lte
                          (<=) - like - in (check among list of values).
                      value:
                        description: Can have array or string type
                ids:
                  type: array
                  description: Array of contacts IDs
                  items:
                    type: integer
