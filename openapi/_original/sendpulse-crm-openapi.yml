        - 'Deposit for contract #2024-117'
        - Final invoice payment
        - Prepayment — Phase 1
      x-ai-capabilities:
        confirmation:
          type: Recommended
          message: >-
            You are about to record a manual payment of {price} {currency}
            against deal/contact. This will affect revenue reporting. Confirm?
        security_info:
          data_handling:
            - ResourceStateUpdate
            - FinancialDataWrite
  /payments/{paymentId}/approve:
    post:
      tags:
        - Payments
      summary: Approve manual payment.
      description: Set approval status for manually created payment
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: number
          description: The unique identifier of the manually created payment to approve
      responses:
        '200':
          description: Payment successfully approved
      operationId: approvePayment
      x-ai-role: financial_operations_manager
      x-ai-description: >-
        Finalizes a manually created payment by setting its approval status.
        This is a critical financial workflow step — manual payments remain in a
        pending state until explicitly approved by an authorized actor. Approval
        triggers downstream processing (invoicing, access grants, status
        notifications).
      x-ai-reasoning-instructions:
        - >-
          Confirm the payment exists and is in a pending/unapproved state before
          attempting approval — approving an already-approved or non-existent
          payment will return an error.
        - >-
          Verify the caller has sufficient privileges to approve payments; this
          action is typically restricted to billing administrators.
        - >-
          Treat this as an irreversible financial action — once approved, the
          payment may trigger downstream effects (subscription activation,
          invoice generation) that cannot be undone via API.
      x-ai-responding-instructions:
        - Confirm the approval by stating the paymentId that was approved.
        - >-
          Inform the user of any downstream effects triggered by the approval
          (e.g., subscription activated, invoice issued).
        - >-
          If the operation fails, clarify whether the payment was already
          approved, does not exist, or the caller lacks permission.
      x-ai-capabilities:
        confirmation:
          type: Required
          message: >-
            Approving a payment is a financial action with downstream effects.
            Confirm before proceeding.
        security_info:
          data_handling:
            - ResourceStateUpdate
            - FinancialTransaction
  /payments/{paymentId}/cancel:
    post:
      tags:
        - Payments
      summary: Cancel manual payment
      description: Set payment status to canceled for manually created payment.
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: number
          description: The unique identifier of the payment to cancel
      responses:
        '200':
          description: Payment successfully canceled
      operationId: cancelPayment
      x-ai-role: billing_operations_specialist
      x-ai-description: >-
        Terminates a manually created payment by transitioning its status to
        'canceled'. This is a financial state mutation — once canceled, the
        payment cannot be resumed or charged. Use when a customer requests
        cancellation, a billing error is detected, or a manual invoice needs to
        be voided before processing.
      x-ai-reasoning-instructions:
        - >-
          Confirm the payment exists and belongs to the current account before
          attempting cancellation.
        - >-
          Verify the payment was created manually — this endpoint is not
          applicable to automated or subscription-based payments.
        - >-
          Check the current payment status: only non-terminal statuses (e.g.,
          pending, created) can be canceled; already completed or failed
          payments may be rejected.
        - >-
          Treat this as an irreversible action — prompt the user to confirm
          intent if there is any ambiguity.
      x-ai-responding-instructions:
        - Confirm the cancellation by echoing the paymentId that was canceled.
        - >-
          Clarify that the action is irreversible and the payment can no longer
          be charged.
        - >-
          If cancellation fails due to status conflict, explain the current
          payment state and what terminal state prevents the action.
        - >-
          Suggest creating a new manual payment if the user needs to restart the
          billing process.
      x-ai-capabilities:
        confirmation:
          type: Required
          message: >-
            Canceling payment {paymentId} is irreversible. Confirm before
            proceeding.
        security_info:
          data_handling:
            - ResourceStateUpdate
            - IrreversibleAction
