                  items:
                    type: integer
                sourceType:
                  type: array
                  items:
                    type: integer
                    enum:
                      - 1
                      - 2
                      - 3
                      - 4
                      - 5
                      - 6
                      - 8
                      - 9
                      - 10
                phone:
                  type: string
                  description: Phone number of a contact
                email:
                  type: string
                tagIds:
                  type: array
                  items:
                    type: integer
                messengerTypeIds:
                  type: array
                  items:
                    type: integer
                messengerLogin:
                  type: string
                sortBy:
                  type: object
                  properties:
                    direction:
                      type: string
                      description: >-
                        Sorting direction. Possible values: asc — ascending
