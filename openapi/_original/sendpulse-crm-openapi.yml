  /tasks:
    post:
      tags:
        - Tasks
      summary: Create tasks
      description: >
        repeatSetting - has 4 types: 1-daily, 2-weekly, 3-monthly, 4-yearly.

        'endSetting' - has 2 types: byDate(2021-11-25), byCount(1)


        1) 'repeatSetting': {'type': 1, 'startDate': '2021-11-25 13:38',

        'endSetting': {'type':'byDate','value': '2021-11-25'},'setting':
        {'everyDay': 2 }};

        <br> 'everyDay' - 2 (repeat every Tuesday)


        2) 'repeatSetting': {'type': 2, 'startDate': '2021-11-25 13:38',

        'endSetting': {'type':'byCount','value': 1},'setting': {'days': [1,4,5],
        'everyWeekOfMonth': 3 }};

        'days': [1,4,5], 'everyWeekOfMonth': 3

        <br> (repeat every Monday, Thursday, Friday of every 3rd week of the
        month)


        3) 'repeatSetting': {'type': 3, 'startDate': '2021-11-25 13:38',

        'endSetting': {'type':'byDate','value': '2021-11-25'},

        'setting': {'numberOfMonth': {'everyDay': 31, 'everyMonth':5} }};

        <br> 'numberOfMonth': {'everyDay': 31, 'everyMonth':5 (repeat every 31st
        day of every 5th month)


        4) 'repeatSetting': {'type': 3, 'startDate': '2021-11-25
        13:38','endSetting': {'type':'byCount','value': 11},

        'setting': {'dayOfMonth': {'everyWeek': 3, 'dayOfWeek':5,
        'everyMonth':12} }};

        <br> 'dayOfMonth': {'everyWeek': 3, 'dayOfWeek':5, 'everyMonth':12} -
        (repeat every 3rd week every 5th day of the week every 12th month)
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  description: Task name
                boardId:
                  type: integer
                stepId:
                  type: integer
                observers:
                  type: array
                  description: Array of users IDs acting as observers
                priority:
                  $ref: '#/components/schemas/TaskPriorityProperty'
                sourceType:
                  $ref: '#/components/schemas/IntegerSourceTypeProperty'
                responsibleId:
                  type: integer
                  description: Responsible user ID
                parentId:
                  type: integer
                  description: Parent task ID
                description:
                  type: string
                  description: Task description
                alert:
                  type: string
                  description: >-
                    Notify before task expires (when notification is enabled).
                    Allowed values - 0(not selected), 15min, 30min, 1h, 2h, 3h,
                    6h, 12h, 24h, 2d, 3d, 4d, 5d, 6d, 7d
                repeat:
                  type: integer
                  description: Do you need to repeat the task
                startAt:
                  type: string
                  format: Y-m-d H:i
                finishAt:
                  type: string
                  format: Y-m-d H:i
                repeatSetting:
                  $ref: '#/components/schemas/TaskRepeats'
                attributes:
                  $ref: '#/components/schemas/TasksAttribute'
                tags:
                  type: array
                  example: '[ 1,2,3 ]'
                  description: IDs of tags
                checklists:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Checklist name
                      items:
                        type: array
                        items:
                          properties:
                            name:
                              type: string
                              description: Checklist item name
                            isDone:
                              type: integer
                              description: Is item is done (checked)
                connections:
                  type: object
                  properties:
                    dealIds:
                      type: array
                      example: '[ 1,2 ]'
                    contactIds:
                      type: array
                      example: '[ 1,2 ]'
                    taskIds:
                      type: array
                      example: '[ 1,2 ]'
                attachments:
                  type: array
                  items:
                    type: string
                  description: >-
                    First, the file must be uploaded to the file manager, and
                    then the file can be attached.
                  example:
                    - /personal/task/sendPulse_crm_report.csv
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/Tasks'
      operationId: createTask
      x-ai-role: project_management_specialist
      x-ai-description: >-
        Creates a new task within a CRM board pipeline. Tasks are the primary
        unit of work tracking in SendPulse CRM — they can be linked to deals,
        contacts, and other tasks, assigned to responsible users, and configured
        with flexible recurrence schedules (daily, weekly, monthly, yearly). The
        recurrence engine supports complex patterns such as "every 3rd Friday of
        every 2nd month", making this endpoint suitable for both one-time and
        long-term recurring workflows.
      x-ai-reasoning-instructions:
        - >-
          Verify that `boardId` and `stepId` exist before creating the task to
          avoid orphan records.
        - >-
          If `repeat` is set to a truthy value, `repeatSetting` must be provided
          and validated against its type: type 1 (daily) requires `everyDay`;
          type 2 (weekly) requires `days` and `everyWeekOfMonth`; type 3/4
          (monthly/yearly) require either `numberOfMonth` or `dayOfMonth`
          sub-objects.
        - >-
          Ensure `startAt` and `finishAt` follow the `Y-m-d H:i` format;
          misformatted dates will silently fail on some backends.
        - >-
          If `attachments` are provided, confirm the files were already uploaded
          via the File Manager — attachment paths must be pre-existing.
        - >-
          When `parentId` is supplied, this is a sub-task — inform the user it
          will appear nested under the parent.
        - >-
          Cross-check that `responsibleId` and all `observers` IDs are valid
          account users to prevent assignment failures.
        - >-
          If `connections` contains `dealIds` or `contactIds`, remind the user
          this links the task bi-directionally — it will appear in those
          deals/contacts' activity feeds.
      x-ai-responding-instructions:
        - >-
          Confirm creation by surfacing the new task ID from the `data` response
          object.
        - >-
          If a repeat schedule was configured, summarize the recurrence pattern
          in plain language (e.g., 'Task will repeat every Monday and Thursday
          for 3 occurrences').
        - >-
          If `parentId` was used, confirm the task was created as a sub-task of
          the specified parent.
        - >-
          Suggest logical next steps: adding checklist items, attaching files,
          or linking the task to a deal or contact.
        - >-
          On validation errors (missing required fields, invalid IDs), clearly
          state which field failed and why.
      x-ai-suggestions:
        - Follow up on proposal
        - Prepare onboarding call
        - Send contract for review
        - Schedule demo with client
      x-ai-capabilities:
        confirmation:
          type: None
        security_info:
          data_handling:
            - ResourceStateUpdate
            - CrossEntityLinking
