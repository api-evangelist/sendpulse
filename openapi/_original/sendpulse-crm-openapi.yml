      x-ai-role: crm_revenue_manager
      x-ai-description: >-
        Records a manual payment event against a CRM deal or contact. This is
        not an online payment gateway call — it registers an already-received or
        offline payment into the pipeline, updating deal financials and contact
        billing history. Critical for keeping revenue data accurate without
        going through an automated checkout flow.
      x-ai-reasoning-instructions:
        - >-
          Require either dealId or contactId — ideally both to anchor the
          payment in context; warn the user if neither is provided.
        - >-
          Validate that price is a positive integer and currency is a recognized
          ISO 4217 code before submitting.
        - >-
          If dealId is provided, consider fetching the deal first to confirm it
          is in an active stage before attaching a payment.
        - >-
          Avoid creating duplicate payments: check whether a payment with the
          same amount and description already exists on the deal.
      x-ai-responding-instructions:
        - >-
          Confirm success by surfacing the new Payment ID and its associated
          deal/contact.
        - >-
          Remind the user that this is a manual record — no actual money
          transfer is initiated.
        - >-
          If the deal stage implies the payment closes the deal, suggest
          updating the deal status accordingly.
