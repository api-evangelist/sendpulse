            schema:
              properties:
                date:
                  type: string
                  format: date
                  description: Expiration date
                time:
                  type: string
                  format: time
                  description: Expiration time
                notifyIn:
                  type:
                    - string
                    - 'null'
                  description: >-
                    Notify before deal expires (when notification is enabled).
                    Allowed values - 0(not selected), 15min, 30min, 1h, 2h, 3h,
                    6h, 12h, 24h, 2d, 3d, 4d, 5d, 6d, 7d
                dealAction:
                  type:
                    - integer
                    - 'null'
                  description: Allowed values 1 - created, 2 - updated
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/DealExpiration'
      operationId: upsertDealExpiration
      x-ai-role: crm_pipeline_manager
      x-ai-description: >-
        Sets or replaces the expiration deadline for a specific deal in the CRM
        pipeline. This endpoint acts as an upsert — if no expiration exists, it
        creates one; if it does, it overwrites it entirely. Expiration dates
        drive urgency-based automation, sales rep notifications, and deal
        auto-closure workflows. Proper use of this endpoint ensures deals don't
        silently stall in the pipeline past their negotiated deadlines.
      x-ai-reasoning-instructions:
        - >-
          Confirm the dealId exists before calling — a 404 on a missing deal is
          a hard failure.
        - >-
          If the user provides only a date without a time, clarify whether a
          default time (e.g., end-of-business) is acceptable or if precision
          matters.
        - >-
          When notifyIn is set, verify the deal has an assigned owner with a
          valid notification channel; otherwise the reminder will be silently
          dropped.
        - >-
          The dealAction field (1=created, 2=updated) is metadata — infer '2'
          when the deal is known to already have an expiration, '1' when setting
          it for the first time.
        - >-
          Avoid setting expiration dates in the past; validate the date is in
          the future before submitting.
        - >-
          If the user wants to remove an expiration, this endpoint is not the
          right tool — check for a DELETE /deals/{dealId}/expiration instead.
      x-ai-responding-instructions:
        - >-
          Confirm the expiration was set by echoing back the date and time in a
          human-readable format.
        - >-
          If notifyIn was provided, remind the user when the notification will
          fire relative to the expiration.
        - >-
          Suggest reviewing related deals in the same pipeline stage that may
          also need expiration dates.
        - >-
          If the response includes a DealExpiration object, highlight the
          effective deadline and any active notification settings.
      x-ai-suggestions:
        - >-
          Set expiration to end of current quarter with a 24h advance
          notification.
        - >-
          Use notifyIn: '2d' for deals in the negotiation stage to give reps
          buffer time.
        - >-
          Combine with a pipeline stage update to automatically move stalled
          deals to 'Closing' before expiry.
      x-ai-capabilities:
        confirmation:
          type: Recommended
          message: >-
            This will overwrite any existing expiration for deal {dealId}.
            Proceed?
        security_info:
          data_handling:
            - ResourceStateUpdate
            - ScheduledNotificationTrigger
    delete:
      tags:
        - Deal Expiration
      summary: Remove deal expiration
      parameters:
        - name: dealId
          in: path
          required: true
          description: Deal ID
          schema:
            type: integer
      responses:
        '204':
          description: Successfully deleted
      operationId: removeDealExpiration
      x-ai-role: crm_deal_manager
      x-ai-description: >-
        Removes the expiration deadline from a deal, effectively making it
        open-ended. Use this when a deal's timeline has been extended
        indefinitely or when a premature expiration was set by mistake. In CRM
        workflows, expiration dates drive automated reminders and stage
        transitions — removing one halts that pressure on the deal.
      x-ai-reasoning-instructions:
        - >-
          Confirm the deal exists and has an active expiration before attempting
          removal — a 204 on a non-expiring deal may still succeed but is a
          no-op.
        - >-
          Check whether any automations or reminders are tied to this deal's
          expiration; removing it may silently disable them.
        - >-
          If the user's intent is to extend the deadline rather than remove it
          entirely, suggest using the update-expiration endpoint instead.
      x-ai-responding-instructions:
        - >-
          On success (204 No Content), confirm that the expiration has been
          cleared and the deal is now open-ended.
        - >-
          Mention that any expiration-triggered automations for this deal are
          now inactive.
        - >-
          If the deal ID is not found or the operation fails, clarify whether
          the deal exists and whether it had an expiration set.
      x-ai-capabilities:
        confirmation:
          type: Recommended
          message: >-
            This will permanently remove the expiration date from the deal. Any
            automated reminders tied to this deadline will stop.
        security_info:
          data_handling:
            - ResourceStateUpdate
