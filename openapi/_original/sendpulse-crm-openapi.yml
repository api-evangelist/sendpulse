        temporary tokens (valid for 1 hour) for enhanced security.
openapi: 3.1.2
info:
  description: >-
    Using the API for the CRM service, you can integrate your system with CRM
    from SendPulse and receive detailed information on pipelines, deals,
    contacts and their attributes and users. You can also create deals and
    contacts, assign and remove fields, tags, contact details and instant
    messengers. On the right, there is a button for authorizing requests made on
    this page. Click “Authorize,” then insert the ID and Secret from your
    account. To perform a request directly from the page, click the "Try it out"
    button within each method block. Then fill in input fields if any (for URL
    parameters, the description is right below the URL request; for body
    parameters, the description is under the “Scheme” button to the right of the
    example), and click “Run.” You will find the server response and description
    of received parameters below.
  title: SendPulse CRM Public API
  version: 0.1.0
security:
  - apiKey: []
  - oauth2: []
servers:
  - url: https://api.sendpulse.com/crm/v1
paths:
  /users:
    get:
      tags:
        - Users
      summary: Get a list of team members
      responses:
        '200':
          description: >-
            | Returns a list of active invited users with the following
            information about each user: team member ID, contact details and
            interface settings * active users - team members who have confirmed
            their account through an email invitation. You can assign deals and
            contacts to your team members.
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/User'
      operationId: getUsers
      x-ai-role: team_management_specialist
      x-ai-description: >-
        Retrieves all active team members in the account — users who have
        confirmed their invitation via email. This list is essential for CRM
        workflows where deals and contacts must be assigned to specific team
        members. Use this endpoint to resolve human-readable names to internal
        IDs before performing assignments.
      x-ai-reasoning-instructions:
        - >-
          Use this list to validate that a target assignee exists and is active
          before assigning deals or contacts.
        - Cache results if performing bulk assignments to avoid repeated calls.
        - >-
          Note that only confirmed (active) users are returned — pending
          invitations are excluded.
      x-ai-responding-instructions:
        - >-
          Present team members by name and role for easier selection by the
          user.
        - >-
          If the list is empty, inform the user that no confirmed team members
          exist yet and suggest sending invitations.
        - >-
          When helping assign resources, reference the team member ID, not just
          the name.
      x-ai-suggestions:
        - Use returned IDs with contact or deal assignment endpoints.
        - >-
          Cross-reference with pipeline stages to see workload distribution per
          team member.
      x-ai-capabilities:
        confirmation:
          type: None
        security_info:
          data_handling:
            - ReadOnly
  /pipelines:
    post:
      tags:
        - Pipelines
      summary: Create new pipeline
      description: Create new pipeline with specified settings
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  description: Pipeline name
                settings:
                  type: array
                  items:
                    $ref: '#/components/schemas/Setting'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/Pipeline'
      operationId: createPipeline
      x-ai-role: crm_workflow_architect
      x-ai-description: >-
        Initializes a new CRM pipeline — a structured, stage-based workflow for
        tracking deals or leads through a defined sales or support process. A
        pipeline is the backbone of CRM automation: it defines the stages
        through which contacts or deals progress and governs which automations,
        notifications, and conditions fire at each transition.
      x-ai-reasoning-instructions:
        - >-
          Before creating, check if a pipeline with a similar name already
          exists to avoid duplicates.
        - >-
          Clarify the intended use case (sales, support, onboarding) to help the
          user choose appropriate stage settings.
        - >-
          Validate that `settings` values conform to the expected schema —
          incomplete settings may result in a non-functional pipeline.
        - >-
          If the user hasn't specified stages or conditions, suggest starting
          with a minimal viable pipeline and iterating.
      x-ai-responding-instructions:
        - >-
          Confirm successful creation by referencing the new pipeline's ID and
          name.
        - >-
          Suggest the next logical step: adding stages or assigning
          contacts/deals to the pipeline.
        - >-
          If settings were omitted, note that default settings were applied and
          they can be updated later.
        - >-
          On failure, explain whether the issue is a naming conflict, invalid
          settings schema, or permission problem.
      x-ai-suggestions:
        - Sales_Pipeline_B2B
        - Lead_Qualification_Flow
        - Customer_Onboarding_Pipeline
        - Support_Escalation_Track
      x-ai-capabilities:
        confirmation:
          type: None
        security_info:
          data_handling:
            - ResourceStateUpdate
    get:
      tags:
        - Pipelines
      summary: Get a list of pipelines
      description: >-
        Returns a list of pipelines with information about each: pipeline ID,
        pipeline creator, created statuses, and pipeline settings
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/Pipeline'
      operationId: getPipelines
      x-ai-role: crm_pipeline_analyst
      x-ai-description: >-
        Retrieves the full list of CRM pipelines configured in the account.
        Pipelines define the sales or workflow stages through which contacts
        move. This endpoint is the entry point for understanding the current
        pipeline structure before creating deals, assigning stages, or
        automating transitions.
      x-ai-reasoning-instructions:
        - >-
          Use this endpoint to discover available pipeline IDs before creating
          or updating deals.
        - >-
          Check pipeline statuses to determine which pipelines are active and
          suitable for new deals.
        - >-
          If the user asks about a specific pipeline by name, fetch all
          pipelines first and filter by name client-side, as the API does not
          support name-based filtering.
      x-ai-responding-instructions:
        - Present the list with pipeline names and IDs for easy reference.
        - >-
          If no pipelines exist, suggest creating one as a prerequisite for deal
          management.
        - >-
          Highlight any pipelines with unusual configurations (e.g., no statuses
          defined) as potential setup issues.
      x-ai-suggestions:
        - >-
          Use the returned pipeline IDs with `createDeal` to assign deals to the
          correct pipeline.
        - >-
          Inspect `statuses` in each pipeline to understand available deal
          stages before progressing contacts.
      x-ai-capabilities:
        confirmation:
          type: None
        security_info:
          data_handling:
            - ReadOnly
  /pipelines/{pipelineId}:
    get:
      tags:
        - Pipelines
      summary: Get information about a pipeline by ID
      description: >-
        Returns information about the specified pipeline: pipeline ID, pipeline
        creator, created statuses, and pipeline settings
      parameters:
        - name: pipelineId
          in: path
          required: true
          description: >-
            ID of a pipeline you need to get information about. It can be
            obtained with the "Get a list of pipelines" method
          schema:
            type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/Pipeline'
      operationId: getPipelineById
      x-ai-role: crm_pipeline_analyst
      x-ai-description: >-
        Retrieves the full configuration snapshot of a single CRM pipeline —
        including its creator, status definitions, and behavioral settings. Use
        this to inspect pipeline structure before automating stage transitions
        or auditing workflow logic.
      x-ai-reasoning-instructions:
        - >-
          Ensure the pipelineId was obtained from the 'Get a list of pipelines'
          response — do not guess or construct IDs manually.
        - >-
          If the user asks about a pipeline by name, resolve the ID first using
          the list endpoint before calling this one.
        - >-
          Check whether the response includes all expected statuses; absence may
          indicate an incomplete pipeline setup.
      x-ai-responding-instructions:
        - >-
          Summarize the pipeline's key settings (name, creator, status count)
          rather than dumping the raw object.
        - >-
          If the user needs to modify the pipeline, suggest the appropriate
          update endpoint as a follow-up.
        - >-
          If a 404 is returned, confirm the pipelineId source and suggest
          re-fetching the pipeline list.
      x-ai-suggestions:
        - >-
          Use this endpoint to verify pipeline structure before creating or
          moving deals through stages.
        - >-
          Combine with 'Get a list of pipelines' to build a full pipeline
          inventory.
      x-ai-capabilities:
        confirmation:
          type: None
        security_info:
          data_handling:
            - ReadOnly
    put:
      tags:
        - Pipelines
      summary: Update information about a pipeline by its ID
      description: Updates information in the specified pipeline
      parameters:
        - name: pipelineId
          in: path
          required: true
          description: Pipeline ID to be updated.
          schema:
            type: integer
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  description: Pipeline name
                order:
                  type: integer
                  description: Field display order
                settings:
                  type: array
                  items:
                    $ref: '#/components/schemas/Setting'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/Pipeline'
      operationId: updatePipeline
      x-ai-role: crm_pipeline_manager
      x-ai-description: >-
        Updates the metadata and configuration of an existing CRM pipeline. A
        pipeline defines the sales or processing stages through which deals
        progress — changing its name, order, or settings reconfigures the
        workflow structure for all deals currently inside it.
      x-ai-reasoning-instructions:
        - >-
          Before updating, confirm the pipelineId exists to avoid silent
          failures.
        - >-
          If renaming, warn the user that the new name should remain unique and
          descriptive to avoid confusion with other pipelines.
        - >-
          When changing `order`, consider that shifting one pipeline's position
          may affect the display order of other pipelines — advise a full
          re-check afterward.
        - >-
          Treat `settings` as a full replacement of the pipeline's configuration
          array, not a partial merge — ensure all desired settings are included
          in the request.
      x-ai-responding-instructions:
        - >-
          Confirm which fields were changed by comparing the request payload
          against the returned `data` object.
        - If the pipeline name was updated, highlight the new name explicitly.
        - >-
          Suggest verifying the pipeline's stage list as a logical next step
          after structural changes.
      x-ai-suggestions:
        - >-
          Retrieve current pipeline data with GET /pipelines/{pipelineId} before
          updating to avoid accidental overwrites.
        - 'Use PATCH semantics in mind: only send fields you intend to change.'
      x-ai-capabilities:
        confirmation:
          type: Recommended
          message: >-
            Updating a pipeline's settings affects all deals currently assigned
            to it. Confirm before proceeding.
        security_info:
          data_handling:
            - ResourceStateUpdate
  /pipelines/{pipelineId}/steps:
    post:
      tags:
        - Pipeline Steps
      summary: Create a new pipeline step
      parameters:
        - name: pipelineId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                order:
                  type: integer
                color:
                  type: string
                  enum:
                    - '#000000'
                    - black
                  description: Step color
                addEndHours:
                  type: integer
                  enum:
                    - null
                    - 1
                    - 2
                    - 3
                    - 4
                    - 5
                    - 6
                    - 8
                    - 9
                    - 10
                  description: Add number of hours or null
                notifyIn:
                  type: string
                  enum:
                    - '0'
                    - 15min
                    - 30min
                    - 1h
                    - 2h
                    - 3h
                    - 6h
                    - 12h
                    - 24h
                    - 2d
                    - 3d
                    - 4d
                    - 5d
                    - 6d
                    - 7d
                  description: Time notification
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/Step'
      operationId: createPipelineStep
      x-ai-role: crm_pipeline_architect
      x-ai-description: >-
        Adds a new stage to an existing sales pipeline, defining the structural
        progression of deals. Each step represents a distinct phase in the sales
        funnel — from initial contact to closing. The order, visual color, and
        time-based notifications shape how the team tracks and responds to deal
        movement through the pipeline.
      x-ai-reasoning-instructions:
        - Verify the pipeline exists before attempting to add a step.
        - >-
          Check the current steps of the pipeline to determine appropriate
          `order` value and avoid collisions.
        - >-
          If `order` is not specified by the user, suggest appending at the end
          (highest order + 1).
        - >-
          Advise using descriptive step names aligned with the actual sales
          process (e.g., 'Qualification', 'Proposal Sent', 'Negotiation').
        - >-
          If `notifyIn` is set, clarify to the user that this controls how far
          in advance or after a deal enters this step a notification is
          triggered.
      x-ai-responding-instructions:
        - >-
          Confirm the new step was created and mention its position (order)
          within the pipeline.
        - >-
          If color was set, acknowledge it to confirm visual differentiation in
          the UI.
        - >-
          Suggest reviewing the full pipeline structure using the list steps
