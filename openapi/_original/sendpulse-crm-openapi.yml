                  type: string
                  format: date
                  description: >-
                    Contact updated date, filter start date. Accepted format
                    YYYY-MM-DD
                updateTo:
                  type: string
                  format: date
                  description: >-
                    Contact updated date, filter end date. Accepted format
                    YYYY-MM-DD
                firstName:
                  type: string
                  description: Contacts first name you want to search for
                lastName:
                  type: string
                  description: Contacts last name you want to search for
                responsibleIds:
                  type: array
                  description: >-
