  + https://github.com/sendpulse/mcp-server
name: SendPulse MCP Server
status: published
description: First-party remote MCP server operated by SendPulse over Streamable HTTP. It fronts the SendPulse REST
  API so an AI client can read statistics, manage contacts and deals, run campaigns and send messages without leaving
  the chat. Currently integrated with the chatbot builder, CRM, Courses, email service and SMTP service.
deployment:
  mode: remote
  endpoint: https://mcp.sendpulse.com/mcp
  transport: streamable-http
  auth: oauth
  verified: probed
  note: 'Endpoint POSTed on 2026-08-13: HTTP 401 {"result":false,"data":null,"error":"Unauthorized action!","code":401}
    for an anonymous tools/list — the server is live and reachable but every method is auth-gated. https://mcp.sendpulse.com/.well-known/oauth-authorization-server
    returns 200 with RFC 8414 metadata. No stdio package is published: github.com/sendpulse/mcp-server contains
    only a README and .gitignore.'
authentication:
  oauth2:
    discovery: https://mcp.sendpulse.com/.well-known/oauth-authorization-server
    issuer: https://mcp.sendpulse.com
    authorization_endpoint: https://mcp.sendpulse.com/oauth/authorize
    token_endpoint: https://mcp.sendpulse.com/oauth/token
    registration_endpoint: https://mcp.sendpulse.com/oauth/register
    grant_types:
    - authorization_code
    - refresh_token
    code_challenge_methods:
    - plain
    - S256
    scopes_supported:
    - rest
    dynamic_client_registration: true
    note: RFC 9728 protected-resource metadata (/.well-known/oauth-protected-resource) is NOT served, so a strict
      MCP client cannot discover this authorization server from the resource.
  headers:
    X-SP-ID: client identifier
    X-SP-SECRET: client secret
    source: https://github.com/sendpulse/mcp-server README
    note: The knowledge-base page documents the same mechanism as X-Client-ID / X-Client-Secret; the two pages disagree
      on header names.
  credentials_page: https://login.sendpulse.com/settings/#api
