  - url: openapi/sendpulse-openapi.yml
    type: OpenAPI
  description: Add and manage phone numbers in address books, send SMS to phone lists,
    create and cancel SMS campaigns, retrieve campaign cost and statistics, and manage
    the SMS blacklist.
