aid: sendpulse
url: https://raw.githubusercontent.com/api-evangelist/sendpulse/refs/heads/main/apis.yml
name: SendPulse
kind: company
description: SendPulse is a multichannel marketing platform with a unified REST API
  for email campaigns and address books, SMTP transactional email, SMS, web push
  notifications, chatbots across messengers, and Automation 360 flows. The API uses
  OAuth2 client_credentials to issue short-lived Bearer tokens against
  https://api.sendpulse.com.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Marketing
- Email
- SMS
- Web Push
- Chatbots
- Transactional Email
- Multichannel
created: '2026-06-25'
modified: '2026-06-25'
specificationVersion: '0.19'
