aid: sendpulse
url: https://raw.githubusercontent.com/api-evangelist/sendpulse/refs/heads/main/apis.yml
name: SendPulse
kind: company
description: SendPulse is a multichannel marketing automation platform covering bulk email, SMTP transactional
  email, SMS, web push, website pop-ups, a CRM, an online course builder, and chatbots across WhatsApp,
  Telegram, Facebook Messenger, Instagram, Viber, TikTok and its own live chat widget. It publishes nineteen
  first-party OpenAPI 3.1 specifications totalling 635 operations from https://api.sendpulse.com/.well-known/openapi/,
  indexed by a master index.yaml and mirrored by an llms.txt, an llms-full.txt, a service-directory.json
  and an ai-plugin.json. Authentication is OAuth 2.0 client_credentials against POST /oauth/access_token
  (one-hour Bearer tokens) or a static account API key in the same Authorization header. SendPulse also
  operates a first-party remote MCP server at https://mcp.sendpulse.com/mcp with 147 published tools covering
  chatbots, CRM, courses, email and SMTP.
