specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: SendPulse
providerId: sendpulse
generated: '2026-08-13'
method: searched
source: https://sendpulse.com/integrations/api
created: '2026-06-25'
modified: '2026-08-13'
reconciled: true
tags:
- Marketing
- Email
- SMS
- Web Push
- Chatbots
- Rate Limiting
- Quotas
- Throttling
description: SendPulse publishes explicit REST request quotas tiered by pricing plan, in requests per minute and
  requests per day, on its API documentation page. Exceeding the quota returns HTTP 429. A separate hard ceiling
  of 10 requests per second is enforced and surfaces as proprietary error code 2020202020. OAuth2 access tokens
  are additionally short-lived (3600s).
sources:
- https://sendpulse.com/integrations/api
- https://api.sendpulse.com/service-directory.json
responseCodes:
  throttled: 429
headers:
  published: false
  note: SendPulse documents NO rate-limit response headers — no X-RateLimit-*, no RateLimit-*, no Retry-After. An
    agent cannot read remaining quota from a response and must infer exhaustion from the 429 status or error code
    2020202020. This is the single biggest runtime-semantics gap in the API.
limits:
- name: Free tier requests per minute
  scope: account
  metric: requests
  limit: '1000'
  window: minute
  applies_to: All free pricing plans in Email, SMTP, Push, Chatbot, Courses, CRM and Pop-ups
- name: Free tier requests per day
  scope: account
  metric: requests
  limit: '500000'
  window: day
  applies_to: All free pricing plans
- name: Standard tier requests per minute
  scope: account
  metric: requests
  limit: '2000'
  window: minute
  applies_to: All pricing plans from Free to Enterprise; Pop-ups and Courses on the Pro plan
- name: Standard tier requests per day
  scope: account
  metric: requests
  limit: '1000000'
  window: day
  applies_to: All pricing plans from Free to Enterprise
- name: Enterprise tier requests per minute
  scope: account
  metric: requests
  limit: '3000'
  window: minute
  applies_to: Email Enterprise; Push Pro with >50,000 subscribers; Chatbots Pro with >5,000 subscribers; SMTP with
    >100,000 emails; CRM Pro. Not available in Pop-ups or Courses.
- name: Enterprise tier requests per day
  scope: account
  metric: requests
  limit: '3000000'
  window: day
  applies_to: Email Enterprise and equivalent tiers
- name: Burst ceiling
  scope: account
  metric: requests
  limit: '10'
  window: second
  note: Exceeding it returns proprietary error code 2020202020 ("More than 10 requests per second").
- name: API campaign creation
  scope: account
  metric: campaigns
  limit: '4'
  window: hour
  note: Exceeding it returns proprietary error code 791 ("API-campaigns limit exceeded (4 per hour)").
- name: OAuth2 access token lifetime
  scope: account
  metric: seconds
  limit: '3600'
  note: Tokens issued by POST /oauth/access_token expire after one hour. Static API keys do not expire; max 5 per
    account.
limit_count: 9
