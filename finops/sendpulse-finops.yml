meters:
- name: subscribers
  description: Stored subscribers/contacts, the primary driver of email plan price.
  unit: subscribers
  aggregation: max
  dimensions:
  - account
  - plan
- name: emails_sent
  description: Bulk email campaign volume, counted against monthly plan or prepaid packages.
  unit: emails
  aggregation: sum
  dimensions:
  - account
  - address_book
- name: smtp_emails
  description: Transactional emails sent over SMTP, billed on separate volume tiers.
  unit: emails
  aggregation: sum
  dimensions:
  - account
- name: sms_messages
  description: SMS messages sent, billed per message by destination country and operator.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - country
- name: web_push_sends
  description: Web push notifications delivered to subscribed browsers.
  unit: notifications
  aggregation: sum
  dimensions:
  - account
  - website
- name: chatbot_subscribers
  description: Chatbot subscribers across messengers, driving chatbot plan price.
  unit: subscribers
  aggregation: max
  dimensions:
  - account
  - messenger
principles:
- name: Visibility
  description: Pull account balance via GET /balance and monitor sending volume per address book and channel.
- name: Allocation
  description: Separate address books, websites, and senders per workload/brand to attribute email, push, and SMS spend.
- name: Optimization
  description: Right-size the email plan to actual subscriber count, clean lists with the email verifier to cut wasted sends, use pay-as-you-go for low-frequency sending, and choose SMS routes by cost.
- name: Accountability
  description: Assign owners per channel; review monthly subscription, prepaid email, and per-country SMS spend against budget.
