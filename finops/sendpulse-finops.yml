publisherName: SendPulse
serviceCategory: Marketing and Communications
billingModel:
  pricingCategory: Subscription and Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: SendPulse
  ServiceCategory: Marketing and Communications
  ProviderName: SendPulse
  PublisherName: SendPulse
  InvoiceIssuerName: SendPulse
