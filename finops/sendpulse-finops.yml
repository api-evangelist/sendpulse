description: >-
  FinOps view of SendPulse spend. SendPulse bills a mix of plan subscriptions
  priced by subscriber/contact count, pay-as-you-go prepaid email packages,
  per-message SMS billed by destination country, separately tiered SMTP
  transactional email, and chatbot plans by subscriber count. The same REST API
  is available across plans, so cost is driven by sending volume and stored
  contacts rather than API calls.
notes: >-
  Per-tier prices and SMS per-country rates change frequently; verify against
  the SendPulse pricing pages during reconciliation.
sources:
- https://sendpulse.com/prices
- https://sendpulse.com/prices/smtp
- https://sendpulse.com/prices/sms
